<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex">
<title>แอดมิน - สัญญาเช่า</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@400;600&display=swap" rel="stylesheet">
<script src="shared.js"></script><script>document.write(CSS)</script>
<style>@media print{.np,#ap,#lg{display:none!important}body{background:#fff;color:#000}.c{border:0;padding:0}}.sg{background:#fff;border:1px solid #bbb;border-radius:8px;padding:6px;max-width:320px}</style></head>
<body><main>
<div id="lg" class="c"><h2>เข้าสู่ระบบแอดมิน</h2><input id="pw" type="password" placeholder="รหัสแอดมิน"><p class="err" id="e"></p><button onclick="login()">เข้าสู่ระบบ</button></div>
<div id="ap" hidden><div class="c"><h2>สร้างลิงก์สัญญาใหม่</h2><label>ชื่อลูกค้า (แสดงบนหน้าสัญญา)</label><input id="nm"><label>อายุลิงก์ (ชั่วโมง)</label><input id="hr" type="number" value="48"><div id="tf"></div><p><button onclick="mk()">สร้างลิงก์</button></p><p id="res"></p></div>
<div class="c"><h2>รายการสัญญา</h2><table id="ls"></table></div></div>
<div id="dt" hidden></div></main>
<script>
var pw='',ST={new:'รอลูกค้ากรอก',submitted:'รอตรวจ',approved:'อนุมัติแล้ว',rejected:'ปฏิเสธ'},L={};
G.forEach(function(g){g[1].forEach(function(x){L[x[0]]=x[1]})});RD.forEach(function(r){L[r[0]]=r[1]});
function A(a,b){return fetch('/api/'+a,{method:b?'POST':'GET',headers:{'x-admin':pw,'content-type':'application/json'},body:b?JSON.stringify(b):undefined}).then(function(r){return r.json().then(function(j){if(!r.ok)throw j.error;return j})})}
function login(){pw=$('pw').value;A('list').then(function(l){$('lg').hidden=true;$('ap').hidden=false;draw(l)}).catch(function(){$('e').textContent='รหัสไม่ถูกต้อง หรือยังไม่ได้ตั้ง ADMIN_PASSWORD'})}
$('tf').innerHTML=Object.keys(TL).map(function(k){return '<label>'+TL[k]+'</label><input data-k="'+k+'"'+(k=='start'||k=='end'?' type="date"':'')+'>'}).join('');
function refresh(){A('list').then(draw)}
function fd(t){return t?new Date(t).toLocaleString('th-TH'):'-'}
function draw(l){$('ls').innerHTML=l.length?l.map(function(c){var s=c.status=='new'&&Date.now()>c.expires?'หมดอายุ':ST[c.status];return '<tr><td>'+E(c.name||'(ไม่ระบุชื่อ)')+'<br><small>'+fd(c.created)+'</small></td><td>'+s+'</td><td><button class="g" onclick="show(\''+c.token+'\')">เปิด</button> <button class="g" onclick="del(\''+c.token+'\')">ลบ</button></td></tr>'}).join(''):'<tr><td>ยังไม่มีสัญญา</td></tr>'}
function mk(){var t={};document.querySelectorAll('[data-k]').forEach(function(i){t[i.dataset.k]=i.value});A('create',{name:$('nm').value,hours:$('hr').value,terms:t}).then(function(j){$('res').innerHTML='ลิงก์: <b>'+E(location.origin+'/?t='+j.token)+'</b><br>PIN: <b>'+j.pin+'</b> (แสดงครั้งเดียว ส่งให้ลูกค้าคนละช่องทางกับลิงก์)';refresh()}).catch(alert)}
function del(t){if(confirm('ลบรายการนี้ถาวร?'))A('delete',{t:t}).then(refresh)}
function rv(t,ok){A('review',{t:t,ok:ok}).then(function(){back();refresh()})}
function back(){$('dt').hidden=true;$('ap').hidden=false}
function tb(o,lab){return '<table>'+Object.keys(o).filter(function(k){return o[k]&&lab[k]}).map(function(k){return '<tr><td>'+E(lab[k])+'</td><td>'+E(o[k])+'</td></tr>'}).join('')+'</table>'}
var DLN='',CL={p3addrNow2:'ที่อยู่ติดต่อ (หน้า 3)',p3addrId:'ที่อยู่ตามบัตร (หน้า 3)',model:'รุ่น',p2model:'รุ่น (หน้า 2)',note:'หมายเหตุ',workAddr:'ที่อยู่ที่ทำงาน'};
function dl(t,b){var o=b.textContent,cut='';b.disabled=true;b.textContent='กำลังสร้าง PDF...';
fetch('/api/pdf?t='+t,{headers:{'x-admin':pw}}).then(function(r){if(!r.ok)return r.json().then(function(j){throw j.error});cut=r.headers.get('x-truncated')||'';return r.blob()}).then(function(bl){var a=document.createElement('a');a.href=URL.createObjectURL(bl);a.download='สัญญา-'+DLN+'.pdf';document.body.appendChild(a);a.click();a.remove();setTimeout(function(){URL.revokeObjectURL(a.href)},9e3);if(cut)alert('ข้อความในช่องต่อไปนี้ยาวเกินและถูกตัดในสัญญา: '+cut.split(',').map(function(k){return CL[k]||L[k]||TL[k]||k}).join(', ')+'\nข้อมูลเต็มดูได้ในใบสรุปหลักฐาน')}).catch(function(e){alert(e||'สร้าง PDF ไม่สำเร็จ')}).then(function(){b.disabled=false;b.textContent=o})}
function show(t){A('view?t='+t).then(function(c){var d=c.data;DLN=d?d.form.first+'-'+d.form.last:'';$('ap').hidden=true;$('dt').hidden=false;
var h='<div class="np"><button class="g" onclick="back()">กลับ</button> <button onclick="print()">พิมพ์ใบสรุปหลักฐาน</button> '+(d?'<button onclick="dl(\''+t+'\',this)">ดาวน์โหลดสัญญา PDF</button> ':'')+(c.status=='submitted'?'<button onclick="rv(\''+t+'\',1)">อนุมัติ</button> <button class="g" onclick="rv(\''+t+'\',0)">ปฏิเสธ</button>':'')+'</div><h1>สัญญาเช่าโทรศัพท์ · ใบสรุปข้อมูลและหลักฐานการเซ็น</h1><p>สถานะ: '+ST[c.status]+'<br>รหัสอ้างอิง: '+c.token.slice(0,8)+'</p><div class="c"><h2>เครื่องและค่างวด</h2>'+tb(c.terms,TL)+'</div>';
if(!d)h+='<p>ลูกค้ายังไม่ได้ส่งข้อมูล</p>';else{var f=d.form;
h+='<div class="c"><h2>ข้อมูลที่ผู้เช่ากรอก</h2>'+tb(f,L)+'</div><div class="c"><h2>หลักฐาน</h2><p>บัตรประชาชน</p><img class="p" src="'+d.idImg+'" alt="บัตร" style="max-width:360px"><p>เซลฟี่คู่บัตร</p><img class="p" src="'+d.selfie+'" alt="เซลฟี่" style="max-width:360px"><p>ลายเซ็นผู้เช่า (ใช้แทนทุกจุดในสัญญา)</p><div class="sg"><img src="'+d.sig+'" alt="ลายเซ็น" style="width:100%"></div></div>'+
'<div class="c"><h2>การยอมรับและข้อมูลประกอบ</h2><p>ผู้เช่าติ๊กยืนยันว่าอ่านและเข้าใจสัญญาและเงื่อนไขท้ายสัญญา ยอมรับเงื่อนไขการชำระ การติดตามและการล็อคเครื่อง และยินยอมตาม PDPA</p><table><tr><td>เวลาที่ส่ง</td><td>'+fd(c.submitted)+'</td></tr><tr><td>IP</td><td>'+E(d.ip)+'</td></tr><tr><td>อุปกรณ์</td><td>'+E(d.ua)+'</td></tr><tr><td>พิกัดที่พัก</td><td>'+d.geo.lat+', '+d.geo.lng+' (±'+d.geo.acc+' ม.) <a href="https://www.google.com/maps?q='+d.geo.lat+','+d.geo.lng+'" target="_blank" rel="noopener">เปิดแผนที่</a></td></tr><tr><td>ไฟล์สัญญา (SHA-256)</td><td style="word-break:break-all">'+CONTRACT_SHA+'</td></tr></table></div>'}
$('dt').innerHTML=h})}
</script></body></html>
