async function supabaseRpc(fn, args) {
  const res = await fetch(`${SUPABASE_URL}/rest/v1/rpc/${fn}`, {
    method: "POST",
    headers: { "Content-Type": "application/json", apikey: SUPABASE_KEY },
    body: JSON.stringify(args),
  });
  const data = await res.json();
  if (!res.ok) throw new Error(data.message || "เรียกฐานข้อมูลไม่สำเร็จ");
  return data;
}

async function supabaseAuth(path, body) {
  const res = await fetch(`${SUPABASE_URL}/auth/v1/${path}`, {
    method: "POST",
    headers: { "Content-Type": "application/json", apikey: SUPABASE_KEY },
    body: JSON.stringify(body),
  });
  const data = await res.json();
  if (!res.ok) throw new Error(data.error_description || data.msg || data.error || "เกิดข้อผิดพลาด");
  return data;
}

async function supabaseRest(path, { method = "GET", token, body } = {}) {
  const res = await fetch(`${SUPABASE_URL}/rest/v1/${path}`, {
    method,
    headers: {
      "Content-Type": "application/json",
      apikey: SUPABASE_KEY,
      Authorization: `Bearer ${token}`,
      ...(method === "POST" || method === "PATCH" ? { Prefer: "return=representation" } : {}),
    },
    body: body ? JSON.stringify(body) : undefined,
  });
  // PATCH/DELETE ที่ไม่มี Prefer header จะได้ 204 No Content กลับมา (ตัวเปล่า) — res.json() พังถ้าเจอ
  // body ว่าง เลยต้องเช็คก่อนเสมอ ไม่ใช่แค่ตอน error (เจอจริงตอนทดสอบหน้าตั้งค่าบัญชี PATCH users)
  const text = await res.text();
  const data = text ? JSON.parse(text) : null;
  if (!res.ok) throw new Error(data?.message || data?.error || "เรียกฐานข้อมูลไม่สำเร็จ");
  return data;
}

/* ============================================================================
 * ตรรกะตรวจสอบ — ย้ายมาจากระบบเดิม (parsePeriod / computePeriodResult_ / nestedStatus)
 * เกือบทั้งหมดคัดลอกตรงๆ ไม่ได้แก้ตรรกะเลย ต่างแค่แหล่งข้อมูล: เดิมอ่านจากแถว Working
 * Reference สะสมทั้งชีท ตอนนี้ดึง "ประวัติการจ่ายของสัญญานั้น" จากตาราง payments จริงแทน
 * ==========================================================================*/
function parsePeriod(raw) {
  if (raw === null || raw === undefined || raw === "") return null;
  const clean = String(raw).trim().replace(/\s+/g, "");
  const hasParen = clean.includes("(");
  const base = hasParen ? clean.substring(0, clean.indexOf("(")) : clean;
  const status = hasParen ? clean.substring(clean.indexOf("(") + 1, clean.length - 1) : "";
  const hasDash = base.includes("-");
  let start, end;
  if (hasDash) {
    const parts = base.split("-");
    start = parseFloat(parts[0]); end = parseFloat(parts[1]);
  } else {
    start = parseFloat(base); end = start;
  }
  const numOK = !isNaN(start) && !isNaN(end);
  const fmtOK = numOK &&
    (status === "" || status === "สะสม" || status === "บางส่วน" || status === "ครบ" || status === "จบ") &&
    start >= 1 && end >= start &&
    (hasDash ? end > start : true) &&
    !(hasDash && status === "ครบ") &&
    start > 0 && end > 0;
  return { clean, hasParen, base, status, hasDash, start, end, fmtOK };
}

// เทียบเท่า periodsCompleted(p) ของเดิม แต่อ่านจากแถว payments จริง (installment_number/
// payment_type แยกฟิลด์ชัดเจนอยู่แล้ว) แทนการแกะจากข้อความ label รวมแบบเดิม ผลลัพธ์เหมือนกันทุกกรณี
function periodsCompletedFromPayment(h) {
  if (!h.payment_type) return h.installment_number; // งวดปกติไม่มีสถานะพิเศษ = ครบเต็มงวด
  if (h.payment_type.includes("ครบ") || h.payment_type.includes("จบ")) return h.installment_number;
  return null; // บางส่วน/สะสม ยังไม่นับว่าครบ
}
function fmt(n) { return Math.round(n).toLocaleString("th-TH"); }
function maxCompletedAll(history) {
  let m = 0;
  for (const h of history) { const c = periodsCompletedFromPayment(h); if (c !== null && c > m) m = c; }
  return m;
}
function lastOKBefore(history, start) {
  let m = 0;
  for (const h of history) { const c = periodsCompletedFromPayment(h); if (c !== null && c < start && c > m) m = c; }
  return m;
}
function partSum(history, start) {
  let s = 0;
  for (const h of history) {
    if (h.installment_number === start && (h.payment_type === "สะสม" || h.payment_type === "บางส่วน")) s += Number(h.amount) || 0;
  }
  return s;
}
function skipNote(start, J) {
  const diff = start - J - 1;
  if (diff === 1) return `ขาดงวด ${J + 1}`;
  if (diff > 1) return `ขาดงวด ${J + 1}-${start - 1}`;
  return "";
}

// ตรรกะเทียบยอด/งวดหลัก — คัดลอกมาจากระบบเดิมทั้งหมด ไม่ได้แก้แม้แต่บรรทัดเดียว
function computePeriodResult_(p, C, I, K, J) {
  if (!p.hasDash && p.status === "") {
    if (p.start !== J + 1) return { status: "ข้ามงวด", note: skipNote(p.start, J) };
    if (K + C === I) return { status: "ถูก", note: "" };
    if (K + C > I) return { status: "ยอดเกิน", note: "" };
    return { status: "จำนวนเงินไม่ตรง", note: `ควรเป็น ${fmt(I - K)}` };
  }
  if (p.status === "สะสม" || p.status === "บางส่วน") {
    if (p.start !== J + 1) return { status: "ข้ามงวด", note: skipNote(p.start, J) };
    if (I === 0) return { status: "รอครบงวด", note: "" };
    if (K + C > I) return { status: "ยอดเกิน", note: "" };
    if (K + C === I) return { status: "ถูก", note: "" };
    return { status: "รอครบงวด", note: "" };
  }
  if (p.status === "ครบ") {
    if (p.start !== J + 1) return { status: "ข้ามงวด", note: skipNote(p.start, J) };
    if (K === 0) return { status: "รูปแบบงวดไม่ถูกต้อง", note: "ใช้ (ครบ) แต่ไม่มียอดสะสม/บางส่วนของงวดนี้มาก่อน ตรวจสอบว่ากรอกถูกงวดหรือควรใช้ (บางส่วน)/(สะสม) แทน" };
    if (K + C === I) return { status: "ถูก", note: "" };
    if (K + C > I) return { status: "ยอดเกิน", note: "" };
    return { status: "จำนวนเงินไม่ตรง", note: `ควรเป็น ${fmt(I - K)}` };
  }
  if ((p.hasDash && p.status === "") || (p.hasDash && p.status === "จบ") || (!p.hasDash && p.status === "จบ")) {
    if (p.start !== J + 1) return { status: "ข้ามงวด", note: skipNote(p.start, J) };
    const G = p.hasDash ? p.end : p.start;
    const eligibleForDiscount = p.status === "จบ" && J <= 5;
    const periodCount = G - p.start + 1;
    const fullExpected = periodCount * I - K;
    const discountedExpected = periodCount * I * 0.9 - K;
    const matchesFull = Math.abs(C - fullExpected) < 0.005;
    const matchesDiscount = eligibleForDiscount && Math.abs(C - discountedExpected) < 0.005;
    if (matchesFull || matchesDiscount) {
      let note = (p.hasDash && p.status === "จบ") ? "ชำระหลายงวดพร้อมจบสัญญา" : "";
      if (matchesDiscount) note += (note ? " — " : "") + "ใช้ส่วนลด 10%";
      return { status: "ถูก", note };
    }
    const expectedNote = eligibleForDiscount
      ? `ควรเป็น ${fmt(fullExpected)} (เต็มราคา) หรือ ${fmt(discountedExpected)} (ลด 10%)`
      : `ควรเป็น ${fmt(fullExpected)}`;
    return { status: "จำนวนเงินไม่ตรง", note: expectedNote };
  }
  return { status: "รูปแบบงวดไม่ถูกต้อง", note: "" };
}

// ค้นหาสัญญาของรหัสนี้จากฐานข้อมูลจริง — ถ้ามีหลายสัญญา (รหัสถูกใช้ซ้ำ) เลือกตัวที่ status=active

async function fetchContractForCode(token, branchId, deviceCode) {
  const rows = await supabaseRest(
    `contracts?device_code=eq.${encodeURIComponent(deviceCode)}&branch_id=eq.${encodeURIComponent(branchId)}&select=*&order=start_date.desc`,
    { token }
  );
  if (!rows.length) return null;
  return rows.find((c) => c.status === "active") || rows[0];
}

// ดึงประวัติการจ่ายทั้งหมดของสัญญานี้ (แทนการไล่อ่านแถว Working Reference ของรหัสนี้ทั้งชีทแบบเดิม)
async function fetchPaymentHistory(token, contractId) {
  return await supabaseRest(
    `payments?contract_id=eq.${contractId}&select=installment_number,payment_type,amount,payment_date&order=installment_number.asc`,
    { token }
  );
}

// เช็คจ่ายซ้ำ (งวด+ประเภท+ยอด+วันที่ตรงกันเป๊ะ) — รวม Working Reference/Archive เดิมเป็นแหล่งเดียว
// เพราะระบบใหม่ไม่แยกสองที่เก็บแล้ว (status ของสัญญาบอกอยู่แล้วว่าปิด/เปิดอยู่)
function findDuplicateInHistory(history, p, C, dateStr) {
  return history.some((h) => (h.payment_type || null) === (p.status || null) &&
    h.installment_number === p.start && Number(h.amount) === C && h.payment_date === dateStr);
}

async function nestedStatus(contract, p, C, history) {
  const L = maxCompletedAll(history);
  if (L >= p.start) return { status: "งวดนี้จ่ายครบไปแล้ว", note: `ลูกค้าชำระถึงงวด ${L} แล้ว ตรวจสอบว่าใส่งวด/รหัสลูกค้าผิดหรือไม่` };

  if (contract.total_installments > 0) {
    const reachedPeriod = p.hasDash ? p.end : p.start;
    if (reachedPeriod > contract.total_installments) {
      return { status: "เกินจำนวนงวดสัญญา", note: `สัญญาของลูกค้ารายนี้กำหนดไว้ ${contract.total_installments} งวด แต่รายการนี้เป็นงวดที่ ${reachedPeriod} — ตรวจสอบว่าใส่งวด/รหัสลูกค้าผิด หรือมีการต่อ/แก้ไขสัญญาโดยไม่ได้อัปเดตข้อมูลสัญญา` };
    }
  }
  const J = lastOKBefore(history, p.start);
  const I = Number(contract.amount_per_installment);
  const K = partSum(history, p.start);
  return computePeriodResult_(p, C, I, K, J);
}

async function checkRowLive(row, priorRowsInBatch, token, branchId, contractCache, checkDate) {
  const code = row.code.trim();
  const amount = parseFloat(row.amount);
  const hasAmount = row.amount && row.amount.trim() !== "";
  const hasFee = row.fee && row.fee.trim() !== "";
  const hasCum = row.cum && row.cum.trim() !== "";
  const hasPeriod = row.period && row.period.trim() !== "";

  const allEmpty = !code && !hasPeriod && !hasAmount && !hasFee && !hasCum;
  if (allEmpty) return { status: "", tone: "neutral" };

  // แถวที่มีแค่ "ค่าธรรมเนียม" และ/หรือ "สะสม" โดยไม่มีงวด/จำนวนเงิน — เป็นรายการพิเศษที่ไม่ผูก
  // เข้าสถานะสัญญาปกติ (นับรวมยอดวันนั้นได้ แต่ไม่ตรวจซ้ำ/ไม่บันทึกเข้าประวัติการจ่ายงวด) ย้ายมา
  // จากระบบเดิมทั้งชุด ต้องเช็คคู่ค่าธรรมเนียม+สะสมก่อนเช็คแยกทีละอย่าง ไม่งั้นยอดสะสมจะหายไปเงียบๆ
  const feeCumOnly = !hasPeriod && !hasAmount && hasFee && hasCum;
  if (feeCumOnly) {
    const note = code
      ? `ค่าธรรมเนียม+สะสมเพิ่มเติมผูกกับรหัสลูกค้า ${code} (ไม่บันทึกเข้าประวัติงวด)`
      : "รายการค่าธรรมเนียม+สะสมพร้อมกัน ไม่ผูกกับรหัสลูกค้า";
    return { status: "ค่าธรรมเนียม+สะสมเพิ่มเติม", tone: "info", note, feeAmount: parseFloat(row.fee) || 0, cumAmount: parseFloat(row.cum) || 0 };
  }
  if (!hasPeriod && !hasAmount && !hasFee && hasCum) {
    const note = code ? `สะสมเพิ่มเติมผูกกับรหัสลูกค้า ${code} (ไม่บันทึกเข้าประวัติงวด)` : "รายการยอดสะสมเดี่ยว ไม่ผูกกับรหัสลูกค้า";
    return { status: "สะสมเพิ่มเติม", tone: "info", note, amount: parseFloat(row.cum) || 0 };
  }
  if (!hasPeriod && !hasAmount && hasFee) {
    const note = code ? `ค่าธรรมเนียมเพิ่มเติมผูกกับรหัสลูกค้า ${code} (ไม่บันทึกเข้าประวัติงวด)` : "รายการค่าธรรมเนียมเดี่ยว ไม่ผูกกับรหัสลูกค้า";
    return { status: "ค่าธรรมเนียมเพิ่มเติม", tone: "info", note, amount: parseFloat(row.fee) || 0 };
  }

  if (!code || !row.period || !row.amount) return { status: "", tone: "neutral" };

  const dupInBatch = priorRowsInBatch.some(
    (r) => r.code.trim() === code && r.period.trim() === row.period.trim() && parseFloat(r.amount) === amount
  );
  if (dupInBatch) return { status: "ซ้ำในรายการตรวจ", tone: "warn" };

  const p = parsePeriod(row.period);
  if (!p || !p.fmtOK) return { status: "รูปแบบงวดไม่ถูกต้อง", tone: "bad" };

  let entry = contractCache.current.get(code);
  if (entry === undefined) {
    try {
      const contract = await fetchContractForCode(token, branchId, code);
      const history = contract ? await fetchPaymentHistory(token, contract.contract_id) : [];
      entry = { contract, history };
    } catch (e) {
      return { status: `เชื่อมต่อไม่สำเร็จ: ${e.message}`, tone: "bad" };
    }
    contractCache.current.set(code, entry);
  }
  const { contract, history } = entry;

  if (!contract) return { status: "ไม่พบข้อมูลลูกค้า", tone: "bad" };
  if (contract.status !== "active") {
    return { status: `สัญญานี้ปิดแล้ว (${contract.status === "closed" ? "ผ่อนจบ" : "คืนเครื่อง"})`, tone: "warn", note: "ลูกค้ารายนี้เคยผ่อนจบ/คืนเครื่องไปแล้ว ตรวจสอบว่าเป็นสัญญาใหม่หรือรายการผิดพลาด" };
  }
  if (isNaN(amount) || amount <= 0) return { status: "จำนวนเงินไม่ถูกต้อง", tone: "bad" };
  if (findDuplicateInHistory(history, p, amount, checkDate)) return { status: "ซ้ำ", tone: "warn" };

  const result = await nestedStatus(contract, p, amount, history);
  return { status: result.status, note: result.note, tone: STATUS_TONE[result.status] || "bad", contractId: contract.contract_id, installmentNumber: p.start, paymentType: p.status || null };
}
const TONE_DOT = { ok: "●", warn: "●", bad: "●", info: "●", neutral: "●", loading: "○" };

// ตรวจทีละแถวตามลำดับ (ไม่ขนาน) เพราะการเช็ค "ซ้ำในรายการตรวจ" ต้องรู้ผลของแถวก่อนหน้า
// ก่อนเสมอ — cache ผลค้นหาสัญญา+ประวัติต่อรหัสไว้ใน session เดียวกัน ไม่ต้องยิงซ้ำถ้าเจอรหัสเดิมหลายแถว
function useComputedRows(rows, token, branchId, checkDate) {
  const [results, setResults] = useState({});
  const contractCache = useRef(new Map());

  useEffect(() => {
    if (!token || !branchId) return;
    let cancelled = false;
    contractCache.current = new Map();
    (async () => {
      for (let i = 0; i < rows.length; i++) {
        const r = rows[i];
        setResults((prev) => ({ ...prev, [r.id]: { status: "", tone: "loading" } }));
      }
      for (let i = 0; i < rows.length; i++) {
        const r = rows[i];
        const res = await checkRowLive(r, rows.slice(0, i), token, branchId, contractCache, checkDate);
        if (cancelled) return;
        setResults((prev) => ({ ...prev, [r.id]: res }));
      }
    })();
    return () => { cancelled = true; };

  }, [rows, token, branchId, checkDate]);

  return rows.map((r) => ({ ...r, result: results[r.id] || { status: "", tone: "neutral" } }));
}

async function resolveEmailForUsername(username) {

  if (!email) throw new Error("ไม่พบรหัสผู้ใช้นี้ในระบบ");

}

/* ============================================================================
 * Dashboard — สรุปภาพรวมสัญญาของสาขาที่เลือก
 * ==========================================================================*/
// ยอดเงินวันนี้ — พอร์ตมาจาก sumMoney() ของระบบเดิมเกือบทั้งหมด ต่างแค่ใช้ tone ที่คำนวณไว้แล้ว
// แทนการเช็คชื่อสถานะเป๊ะๆ ทีละสตริง (ระบบใหม่ไม่มีสถานะ "ยืนยันแล้ว"/"ลูกค้าใหม่" แยกต่างหากแล้ว
// เพราะสถานะสัญญาเป็นฟิลด์ตรงๆ ในฐานข้อมูลอยู่แล้ว ไม่ต้องเดาจากประวัติเหมือนเดิม)
function sumMoney(computed) {
  let installTotal = 0, feeTotal = 0, cumTotal = 0, slipTotal = 0, pendingTotal = 0;
  computed.forEach((row) => {
    const r = row.result;
    if (!r.status) return;
    if (r.tone === "ok" || r.status === "รอครบงวด") {
      installTotal += parseFloat(row.amount) || 0;
      feeTotal += parseFloat(row.fee) || 0;
      cumTotal += parseFloat(row.cum) || 0;
      slipTotal += parseFloat(row.slip) || 0;
      if (r.status === "รอครบงวด") pendingTotal += parseFloat(row.amount) || 0;
    } else if (r.status === "ค่าธรรมเนียม+สะสมเพิ่มเติม") {
      feeTotal += r.feeAmount || 0; cumTotal += r.cumAmount || 0; slipTotal += parseFloat(row.slip) || 0;
    } else if (r.status === "ค่าธรรมเนียมเพิ่มเติม") {
      feeTotal += r.amount || 0; slipTotal += parseFloat(row.slip) || 0;
    } else if (r.status === "สะสมเพิ่มเติม") {
      cumTotal += r.amount || 0; slipTotal += parseFloat(row.slip) || 0;
    }
  });
  return { installTotal, feeTotal, cumTotal, slipTotal, pendingTotal, dailyTotal: installTotal + feeTotal + cumTotal };
}

// รายชื่อสถานะคงที่สำหรับโชว์ pill ครบทุกอัน (แม้ค่าเป็น 0) เหมือนระบบเดิม — ต่างจากเดิมแค่คำที่ใช้
// ในบางสถานะ เพราะระบบใหม่ไม่มี "ลูกค้าใหม่"/"ยืนยันแล้ว" แยกต่างหากแล้ว (สถานะสัญญาเป็นฟิลด์ตรงๆ)
const OK_STATUS_LIST = ["ถูก", "รอครบงวด", "ค่าธรรมเนียมเพิ่มเติม", "สะสมเพิ่มเติม", "ค่าธรรมเนียม+สะสมเพิ่มเติม"];
const ISSUE_STATUS_LIST = ["ซ้ำ", "ซ้ำในรายการตรวจ", "ข้ามงวด", "จำนวนเงินไม่ตรง", "ยอดเกิน", "รูปแบบงวดไม่ถูกต้อง", "ไม่พบข้อมูลลูกค้า", "งวดนี้จ่ายครบไปแล้ว", "เกินจำนวนงวดสัญญา"];
function isIssueStatus(status) {
  return ISSUE_STATUS_LIST.includes(status) || status.startsWith("สัญญานี้ปิดแล้ว");
}

function StatusPillRow({ t, list, counts, isOk }) {
  return (
    <div style={{ display: "flex", gap: 8, flexWrap: "wrap" }}>

        return (
          <div key={s} style={{ display: "flex", alignItems: "center", gap: 8, background: c === 0 ? t.surfaceAlt : (isOk ? t.okSoft : t.badSoft), color: c === 0 ? t.ink3 : (isOk ? t.ok : t.bad), borderRadius: 10, padding: "8px 12px", fontSize: 12.5 }}>
            <span style={{ fontFamily: "'IBM Plex Mono', monospace", fontWeight: 700, fontSize: 15 }}>{c}</span>
            <span>{s}</span>
          </div>
        );
      })}
    </div>
  );
}
function MoneyChips({ t, totals }) {

    <div style={{ background: t.surfaceAlt, borderRadius: 10, padding: "10px 14px", flex: 1, minWidth: 120 }}>

      {chip("สะสมรวม", totals.cumTotal)}
      {chip("ยอดรอครบงวด", totals.pendingTotal)}

}
function SlipBanner({ t, totals }) {
  const slipDiff = totals.slipTotal - totals.dailyTotal;
  const slipMatch = slipDiff === 0;
  return (
    <div style={{ display: "flex", alignItems: "center", gap: 12, padding: "12px 14px", borderRadius: 10, background: slipMatch ? t.okSoft : t.badSoft }}>
      <div style={{ width: 30, height: 30, borderRadius: 99, background: slipMatch ? t.ok : t.bad, color: "#fff", display: "flex", alignItems: "center", justifyContent: "center", fontWeight: 700, flexShrink: 0 }}>{slipMatch ? "✓" : "!"}</div>
      <div>
        <div style={{ fontWeight: 600, fontSize: 13, color: slipMatch ? t.ok : t.bad }}>{slipMatch ? "ยอดสลิปตรงกับยอดรวมประจำวัน" : "ยอดสลิปไม่ตรงกับยอดรวมประจำวัน"}</div>
        <div style={{ fontSize: 12, color: t.ink2 }}>{slipMatch ? "ไม่พบผลต่าง สามารถปิดยอดวันนี้ได้" : `ผลต่าง ${fmt(Math.abs(slipDiff))} บาท — ตรวจสอบรายการยอดตามสลิปอีกครั้ง`}</div>
      </div>
    </div>
  );
}

  const countBy = (list) => { const c = {}; list.forEach((r) => { c[r.result.status] = (c[r.result.status] || 0) + 1; }); return c; };
  const totals = sumMoney(computed);

  return (

// สรุปยอดตามช่วงลำดับที่ตรวจ — ทำงานได้จริงเพราะคำนวณจากรายการที่กำลังตรวจอยู่ตอนนี้โดยตรง ไม่ต้อง
// พึ่งการบันทึกถาวรเลย (ต่างจาก "รายงานสรุปตามช่วงวันที่" ด้านล่างที่ต้องรอฟีเจอร์บันทึกก่อน)
function SequenceRangeSummary({ t, computed }) {
  const [from, setFrom] = useState("");
  const [to, setTo] = useState("");
  const [result, setResult] = useState(null);
  const input = mkInput(t);

  function run() {
    const start = from.trim() ? Math.max(1, parseInt(from, 10)) : 1;
    const end = to.trim() ? Math.min(computed.length, parseInt(to, 10)) : computed.length;
    const subset = computed.slice(start - 1, end);
    setResult({ start, end, totals: sumMoney(subset), count: subset.filter((r) => r.result.status).length });
  }

  return (
    <Card t={t} style={{ marginBottom: 16 }}>
      <div style={{ fontWeight: 600, fontSize: 14.5, marginBottom: 6 }}>สรุปยอดตามช่วงลำดับที่ตรวจ</div>
      <div style={{ fontSize: 12, color: t.ink2, marginBottom: 14, lineHeight: 1.6 }}>เว้นว่างช่องใดช่องหนึ่งหรือทั้งคู่ = รวมทั้งหมด (ดูเลขลำดับได้จากคอลัมน์ # ในตาราง "รายการวันนี้" ที่หน้าตรวจสอบ)</div>
      <div style={{ display: "flex", gap: 12, alignItems: "flex-end", flexWrap: "wrap" }}>
        <div>
          <label style={mkLabel(t)}>จากลำดับที่</label>
          <input style={{ ...input, width: 140 }} placeholder="ไม่ระบุ = แถวแรก" value={from} onChange={(e) => setFrom(e.target.value)} />
        </div>
        <div>
          <label style={mkLabel(t)}>ถึงลำดับที่</label>
          <input style={{ ...input, width: 140 }} placeholder="ไม่ระบุ = แถวสุดท้าย" value={to} onChange={(e) => setTo(e.target.value)} />
        </div>
        <button onClick={run} style={{ background: t.accent, color: t.accentInk, border: "none", borderRadius: 8, padding: "9px 18px", fontSize: 13.5, fontWeight: 600, cursor: "pointer", fontFamily: "inherit" }}>สรุปช่วงนี้</button>
      </div>
      {result && (
        <div style={{ marginTop: 16, paddingTop: 16, borderTop: `1px solid ${t.border}` }}>
          <div style={{ fontSize: 12.5, color: t.ink2, marginBottom: 10 }}>ลำดับที่ {result.start}–{result.end} ({result.count} รายการที่มีผลตรวจ)</div>
          <MoneyChips t={t} totals={result.totals} />
          <div style={{ fontSize: 15, fontWeight: 700, fontFamily: "'IBM Plex Mono', monospace" }}>{fmt(result.totals.dailyTotal)} <span style={{ fontSize: 12, fontWeight: 400, color: t.ink2 }}>บาท — ยอดรวมช่วงนี้</span></div>
        </div>
      )}
    </Card>
  );
}

// รายงานสรุปตามช่วงวันที่ — ต้องมีปุ่ม "บันทึก" (เขียนข้อมูลลง Supabase จริง) ก่อนถึงจะมีอะไรให้ดูย้อนหลัง

  return (
    <Card t={t}>

/* ============================================================================
 * Working Reference — ประวัติการจ่ายเงินล่าสุด ค้นหาตามรหัสลูกค้า หรือดูตามวันที่
 * ==========================================================================*/
const THAI_MONTHS = ["มกราคม", "กุมภาพันธ์", "มีนาคม", "เมษายน", "พฤษภาคม", "มิถุนายน", "กรกฎาคม", "สิงหาคม", "กันยายน", "ตุลาคม", "พฤศจิกายน", "ธันวาคม"];

// แกะบรรทัดที่วาง (รหัส,งวด,ยอด,วัน,เดือน,ปี) แบบยืดหยุ่นเหมือนระบบเดิมทุกอย่าง — ลองคั่นด้วย Tab
// ก่อน (ปกติก็อปจาก Excel) ไม่ครบค่อยลองคอมมา ไม่ครบอีกค่อยลองช่องว่าง เดือนรับได้ทั้งชื่อไทย/เลข
// 1-12 ปีรับได้ทั้ง พ.ศ./ค.ศ. (เดา: ถ้าน้อยกว่า 2400 ถือว่าเป็น ค.ศ. แล้วบวก 543 ให้เอง)
function parseImportLine(line) {
  let parts = line.split("\t");
  if (parts.length < 6) parts = line.split(",");
  if (parts.length < 6) parts = line.trim().split(/\s+/);
  parts = parts.map((s) => s.trim());
  if (parts.length < 6) return null;
  const [code, period, amountStr, dayStr, monthStr, yearStr] = parts;
  const amount = parseFloat(String(amountStr).replace(/,/g, ""));
  const day = parseInt(dayStr, 10);
  let monthName = monthStr;
  if (/^\d+$/.test(monthStr)) {
    const mi = parseInt(monthStr, 10);
    if (mi >= 1 && mi <= 12) monthName = THAI_MONTHS[mi - 1];
  }
  let yearBE = parseInt(yearStr, 10);
  if (!isNaN(yearBE) && yearBE < 2400) yearBE += 543;
  const monthIdx = THAI_MONTHS.indexOf(monthName);
  if (!code || !period || isNaN(amount) || isNaN(day) || monthIdx === -1 || isNaN(yearBE)) return null;
  return { code, period, amount, day, monthIdx, yearBE };
}
function toISODate(day, monthIdx, yearBE) {
  return `${yearBE - 543}-${String(monthIdx + 1).padStart(2, "0")}-${String(day).padStart(2, "0")}`;
}

// สร้าง+บันทึกแถว payment จริง 1 แถว — หา contract_id จากรหัสลูกค้าก่อนเสมอ (ใช้ cache ต่อ session
// เดียวกับหน้าตรวจสอบ ไม่ต้องยิงซ้ำถ้าเจอรหัสเดิมหลายแถว) เช็คซ้ำก่อน insert ทุกครั้งกันกดซ้ำโดยไม่ตั้งใจ
async function postPaymentRow(token, branchId, code, period, amount, isoDate, contractCache) {
  const p = parsePeriod(period);
  if (!p || !p.fmtOK) return { ok: false, msg: `งวดที่ "${period}" รูปแบบไม่ถูกต้อง` };
  let contract = contractCache.get(code);
  if (contract === undefined) {
    contract = await fetchContractForCode(token, branchId, code);
    contractCache.set(code, contract);
  }
  if (!contract) return { ok: false, msg: `ไม่พบรหัสลูกค้า "${code}" ในสาขานี้` };
  const installment_number = p.hasDash ? p.end : p.start;
  const payment_type = p.status || null;
  const dup = await supabaseRest(
    `payments?contract_id=eq.${contract.contract_id}&installment_number=eq.${installment_number}&amount=eq.${amount}&payment_date=eq.${isoDate}&select=payment_id&limit=1`,
    { token }
  );
  if (dup.length) return { ok: false, msg: `ซ้ำ — มีแถวนี้อยู่ในฐานข้อมูลแล้ว (contract_id ${contract.contract_id})` };
  await supabaseRest("payments", { method: "POST", token, body: { contract_id: contract.contract_id, installment_number, payment_type, amount, payment_date: isoDate } });
  return { ok: true, msg: `บันทึกแล้ว (contract_id ${contract.contract_id} งวด ${installment_number})` };
}

function ImportPasteCard({ t, token, branchId }) {
  const [text, setText] = useState("");
  const [results, setResults] = useState(null);
  const [busy, setBusy] = useState(false);
  const input = mkInput(t);

  async function doImport() {
    setBusy(true); setResults(null);
    const lines = text.split("\n").map((l) => l.trim()).filter(Boolean);
    const out = [];
    const cache = new Map();
    for (let i = 0; i < lines.length; i++) {
      const parsed = parseImportLine(lines[i]);
      if (!parsed) { out.push({ line: i + 1, ok: false, msg: "จำนวนคอลัมน์ไม่ครบ 6 ช่อง หรือรูปแบบไม่ถูกต้อง" }); continue; }
      try {
        const r = await postPaymentRow(token, branchId, parsed.code, parsed.period, parsed.amount, toISODate(parsed.day, parsed.monthIdx, parsed.yearBE), cache);
        out.push({ line: i + 1, ...r });
      } catch (e) { out.push({ line: i + 1, ok: false, msg: e.message }); }
    }
    setResults(out);
    setBusy(false);
    if (out.length && out.every((r) => r.ok)) setText("");
  }

  return (
    <Card t={t} style={{ marginBottom: 16 }}>
      <div style={{ fontWeight: 600, fontSize: 14.5, marginBottom: 6 }}>เพิ่มข้อมูลเอง (วางจาก Excel)</div>
      <div style={{ fontSize: 12, color: t.ink2, marginBottom: 12, lineHeight: 1.6 }}>แต่ละแถว: รหัสลูกค้า, งวดที่, จำนวนเงิน, วันที่, เดือน, พ.ศ. — คั่นด้วย Tab (ก็อปจาก Excel วางได้เลย) หนึ่งบรรทัดต่อหนึ่งแถว</div>
      <textarea style={{ ...input, height: 130, resize: "vertical", fontFamily: "'IBM Plex Mono', monospace" }} value={text} onChange={(e) => setText(e.target.value)} placeholder={"9\t7\t2700\t20\tกรกฎาคม\t2568"} />
      <button onClick={doImport} disabled={busy || !text.trim()} style={{ marginTop: 12, background: t.accent, color: t.accentInk, border: "none", borderRadius: 8, padding: "9px 18px", fontSize: 13.5, fontWeight: 600, cursor: busy ? "default" : "pointer", fontFamily: "inherit", opacity: busy || !text.trim() ? 0.6 : 1 }}>
        {busy ? "กำลังนำเข้า..." : "นำเข้าข้อมูล"}
      </button>
      {results && (
        <div style={{ marginTop: 14 }}>
          <div style={{ fontSize: 13, fontWeight: 600, color: results.every((r) => r.ok) ? t.ok : t.bad, marginBottom: 8 }}>
            สำเร็จ {results.filter((r) => r.ok).length} / ล้มเหลว {results.filter((r) => !r.ok).length} จากทั้งหมด {results.length} แถว
          </div>
          <div style={{ maxHeight: 200, overflowY: "auto", display: "flex", flexDirection: "column", gap: 4 }}>
            {results.map((r, i) => (<div key={i} style={{ fontSize: 12, color: r.ok ? t.ok : t.bad }}>บรรทัด {r.line}: {r.msg}</div>))}
          </div>
        </div>
      )}
    </Card>
  );
}

// เทียบข้อมูลที่วางมากับ "รายการวันนี้" ในหน้าตรวจสอบก่อนเสมอ — ต้องตรงกันครบทุกแถวถึงจะบันทึกได้
// (กันบันทึกข้อมูลที่ไม่ตรงกับสิ่งที่ตรวจสอบไว้บนหน้าจอจริง) ย้ายมาจากระบบเดิมทั้ง logic
function BackfillCompareCard({ t, token, branchId, computed }) {
  const [text, setText] = useState("");
  const now = new Date();
  const [day, setDay] = useState(now.getDate());
  const [monthIdx, setMonthIdx] = useState(now.getMonth());
  const [yearBE, setYearBE] = useState(now.getFullYear() + 543);
  const [compareResult, setCompareResult] = useState(null);
  const [committing, setCommitting] = useState(false);
  const [commitResult, setCommitResult] = useState(null);
  const input = mkInput(t);

  function doCompare() {
    const lines = text.split("\n").map((l) => l.trim()).filter(Boolean);
    const pasted = lines.map((line) => {
      let parts = line.split("\t");
      if (parts.length < 3) parts = line.split(",");
      if (parts.length < 3) parts = line.trim().split(/\s+/);
      parts = parts.map((s) => s.trim());
      return { code: parts[0] || "", period: parts[1] || "", amount: parts[2] || "" };
    }).filter((r) => r.code || r.period || r.amount);

    const todayPool = computed.filter((r) => r.result.status).map((r) => ({ code: r.code.trim(), period: r.period.trim(), amount: parseFloat(r.amount) || 0, used: false }));
    const matched = [], mismatched = [];
    pasted.forEach((row) => {
      const amt = parseFloat(row.amount) || 0;
      let hit = todayPool.find((w) => !w.used && w.code === row.code && w.period === row.period && w.amount === amt);
      if (hit) { hit.used = true; matched.push(row); return; }
      let sameCodePeriod = todayPool.find((w) => !w.used && w.code === row.code && w.period === row.period);
      if (sameCodePeriod) { mismatched.push({ row, reason: `จำนวนเงินไม่ตรง: ในรายการวันนี้มี ${fmt(sameCodePeriod.amount)} บาท แต่วางมา ${fmt(amt)} บาท` }); return; }
      let sameCode = todayPool.find((w) => !w.used && w.code === row.code);
      if (sameCode) { mismatched.push({ row, reason: `งวดไม่ตรง: ในรายการวันนี้มีงวด "${sameCode.period}" แต่วางมางวด "${row.period}"` }); return; }
      mismatched.push({ row, reason: "ไม่พบรหัสลูกค้านี้ในรายการวันนี้เลย" });
    });
    todayPool.filter((w) => !w.used).forEach((w) => {
      mismatched.push({ row: { code: w.code, period: w.period, amount: String(w.amount) }, reason: "มีอยู่ในรายการวันนี้ แต่ไม่พบในข้อมูลที่วางมาเทียบเลย" });
    });
    setCompareResult({ matched, mismatched, pastedCount: pasted.length });
    setCommitResult(null);
  }

  async function doCommit() {
    setCommitting(true);
    const isoDate = toISODate(day, monthIdx, yearBE);
    const cache = new Map();
    const out = [];
    for (const row of compareResult.matched) {
      try {
        const r = await postPaymentRow(token, branchId, row.code, row.period, parseFloat(row.amount) || 0, isoDate, cache);
        out.push({ ...row, ...r });
      } catch (e) { out.push({ ...row, ok: false, msg: e.message }); }
    }
    setCommitResult(out);
    setCommitting(false);
  }

  const allGood = compareResult && compareResult.mismatched.length === 0 && compareResult.matched.length > 0;
  const selectStyle = { ...input, cursor: "pointer" };

  return (
    <Card t={t}>
      <div style={{ fontWeight: 600, fontSize: 14.5, marginBottom: 6 }}>เทียบ/เพิ่มข้อมูลย้อนหลังเข้า Working Reference</div>
      <div style={{ fontSize: 12, color: t.ink2, marginBottom: 12, lineHeight: 1.6 }}>วางข้อมูล (รหัสลูกค้า, งวดที่, จำนวนเงิน) ระบบจะเทียบกับ "รายการวันนี้" ในหน้าตรวจสอบ ว่าตรงกันไหม ขาดอะไร หรือมีอะไรผิดเพี้ยน — ถ้าตรงกันครบทุกแถว จะมีปุ่มให้บันทึกลง Working Reference โดยใช้วันที่เลือกด้านล่างนี้</div>
      <div style={{ display: "flex", gap: 12, marginBottom: 12, flexWrap: "wrap" }}>
        <div><label style={mkLabel(t)}>วัน (ใช้ตอนบันทึกจริง)</label>
          <select value={day} onChange={(e) => setDay(Number(e.target.value))} style={{ ...selectStyle, width: 90 }}>
            {Array.from({ length: 31 }, (_, i) => i + 1).map((d) => <option key={d} value={d}>{d}</option>)}
          </select>
        </div>
        <div><label style={mkLabel(t)}>เดือน (ใช้ตอนบันทึกจริง)</label>
          <select value={monthIdx} onChange={(e) => setMonthIdx(Number(e.target.value))} style={{ ...selectStyle, width: 140 }}>
            {THAI_MONTHS.map((m, i) => <option key={m} value={i}>{m}</option>)}
          </select>
        </div>
        <div><label style={mkLabel(t)}>พ.ศ. (ใช้ตอนบันทึกจริง)</label>
          <select value={yearBE} onChange={(e) => setYearBE(Number(e.target.value))} style={{ ...selectStyle, width: 100 }}>
            {Array.from({ length: 5 }, (_, i) => now.getFullYear() + 543 - 2 + i).map((y) => <option key={y} value={y}>{y}</option>)}
          </select>
        </div>
      </div>
      <textarea style={{ ...input, height: 110, resize: "vertical", fontFamily: "'IBM Plex Mono', monospace" }} value={text} onChange={(e) => setText(e.target.value)} placeholder={"9\t7\t2700"} />
      <button onClick={doCompare} disabled={!text.trim()} style={{ marginTop: 12, background: t.accent, color: t.accentInk, border: "none", borderRadius: 8, padding: "9px 18px", fontSize: 13.5, fontWeight: 600, cursor: "pointer", fontFamily: "inherit" }}>เทียบข้อมูล</button>

      {compareResult && (
        <div style={{ marginTop: 16 }}>
          <div style={{ background: allGood ? t.okSoft : t.badSoft, color: allGood ? t.ok : t.bad, borderRadius: 8, padding: "10px 12px", fontSize: 12.5, fontWeight: 600, marginBottom: 12 }}>
            {compareResult.mismatched.length === 0 ? "ตรงกันทั้งหมด" : `ตรงกัน ${compareResult.matched.length} จาก ${compareResult.pastedCount} รายการที่วางมา`}
          </div>
          {compareResult.mismatched.length > 0 && (
            <div style={{ marginBottom: 12 }}>
              <div style={{ fontSize: 12.5, fontWeight: 600, color: t.bad, marginBottom: 6 }}>ขาดหาย/ผิดเพี้ยน ({compareResult.mismatched.length})</div>
              <div style={{ display: "flex", flexDirection: "column", gap: 4, maxHeight: 200, overflowY: "auto" }}>
                {compareResult.mismatched.map((m, i) => (
                  <div key={i} style={{ fontSize: 12, background: t.badSoft, color: t.bad, borderRadius: 6, padding: "6px 10px" }}>{m.row.code} / {m.row.period} / {m.row.amount} — {m.reason}</div>
                ))}
              </div>
            </div>
          )}
          {allGood && !commitResult && (
            <button onClick={doCommit} disabled={committing} style={{ background: t.ok, color: "#fff", border: "none", borderRadius: 8, padding: "9px 18px", fontSize: 13.5, fontWeight: 600, cursor: committing ? "default" : "pointer", fontFamily: "inherit", opacity: committing ? 0.6 : 1 }}>
              {committing ? "กำลังบันทึก..." : `บันทึกลง Working Reference (${compareResult.matched.length} แถว)`}
            </button>
          )}
          {commitResult && (
            <div style={{ marginTop: 10 }}>
              <div style={{ fontSize: 13, fontWeight: 600, color: commitResult.every((r) => r.ok) ? t.ok : t.bad, marginBottom: 6 }}>
                บันทึกสำเร็จ {commitResult.filter((r) => r.ok).length} / ล้มเหลว {commitResult.filter((r) => !r.ok).length}
              </div>
              {commitResult.map((r, i) => (<div key={i} style={{ fontSize: 12, color: r.ok ? t.ok : t.bad }}>{r.code} / {r.period}: {r.msg}</div>))}
            </div>
          )}
        </div>
      )}
    </Card>
  );
}

// ย้ายลูกค้าคืนเครื่อง — ค้นหาสัญญาที่กำลังผ่อนอยู่ (status='active') ของรหัสนี้ในสาขานี้ พรีวิวประวัติ+ยอดรวม
// ก่อนยืนยันเปลี่ยนเป็น returned (ใช้ InstallmentGrid ชุดเดียวกับหน้าตรวจ+ซ่อมงวด กันคำนวณคนละชุดเพี้ยนกัน)
function CloseContractCard({ t, token, branchId }) {
  const [code, setCode] = useState("");
  const [loading, setLoading] = useState(false);
  const [err, setErr] = useState("");
  const [contract, setContract] = useState(null);
  const [history, setHistory] = useState([]);
  const [confirming, setConfirming] = useState(false);
  const [done, setDone] = useState(false);
  const input = mkInput(t);

  async function search(e) {
    e?.preventDefault();
    if (!code.trim()) return;
    setLoading(true); setErr(""); setContract(null); setHistory([]); setDone(false);
    try {
      const rows = await supabaseRest(`contracts?device_code=eq.${encodeURIComponent(code.trim())}&branch_id=eq.${branchId}&status=eq.active&select=*`, { token });
      if (!rows.length) { setErr("ไม่พบสัญญาที่กำลังผ่อนอยู่สำหรับรหัสนี้ในสาขานี้"); return; }
      const c = rows[0];
      const h = await supabaseRest(`payments?contract_id=eq.${c.contract_id}&select=*&order=installment_number.asc`, { token });
      setContract(c); setHistory(h);
    } catch (e2) { setErr(e2.message); }
    finally { setLoading(false); }
  }

  async function confirmClose() {
    setConfirming(true); setErr("");
    try {
      await supabaseRest(`contracts?contract_id=eq.${contract.contract_id}`, { method: "PATCH", token, body: { status: "returned" } });
      setDone(true);
    } catch (e) { setErr(e.message); }
    finally { setConfirming(false); }
  }

  const totalPaid = history.reduce((s, h) => s + Number(h.amount), 0);
  const L = contract ? maxCompletedAll(history) : 0;

  return (
    <Card t={t}>
      <div style={{ fontWeight: 600, fontSize: 14.5, marginBottom: 6 }}>ย้ายลูกค้าคืนเครื่อง</div>
      <div style={{ fontSize: 12, color: t.ink2, marginBottom: 12, lineHeight: 1.6 }}>ค้นหารหัสลูกค้า ตรวจสอบประวัติและยอดรวมก่อน แล้วยืนยันเปลี่ยนสถานะสัญญาเป็น "คืน/ยึดเครื่อง"</div>
      {!done && (
        <form onSubmit={search} style={{ display: "flex", gap: 10, marginBottom: contract ? 16 : 0 }}>
          <input style={input} placeholder="รหัสลูกค้า เช่น 9" value={code} onChange={(e) => { setCode(e.target.value); setContract(null); }} />
          <button type="submit" disabled={loading} style={{ background: t.accent, color: t.accentInk, border: "none", borderRadius: 8, padding: "9px 18px", fontSize: 13.5, fontWeight: 600, cursor: loading ? "default" : "pointer", fontFamily: "inherit", flexShrink: 0, opacity: loading ? 0.6 : 1 }}>
            {loading ? "กำลังค้นหา..." : "ค้นหา"}
          </button>
        </form>
      )}
      <ErrBox t={t} msg={err} />
      {done && (
        <div style={{ background: t.okSoft, color: t.ok, borderRadius: 8, padding: "10px 12px", fontSize: 13, fontWeight: 600 }}>
          ย้ายสัญญา #{contract.contract_id} ({contract.device_code}) เป็น "คืน/ยึดเครื่อง" เรียบร้อยแล้ว
        </div>
      )}
      {contract && !done && (
        <div>
          <div style={{ display: "flex", gap: 20, flexWrap: "wrap", fontSize: 13.5, background: t.surfaceAlt, borderRadius: 10, padding: 12, marginBottom: 12 }}>
            <div><span style={{ color: t.ink2 }}>contract_id: </span><b>{contract.contract_id}</b></div>

  const [err, setErr] = useState("");

  async function runDateSearch() {
    setLoading(true); setErr(""); setRows([]);
    try {
      const data = await supabaseRest(`payments?payment_date=eq.${date}&select=payment_id,contract_id,installment_number,payment_type,amount,payment_date&order=payment_id.desc&limit=300`, { token });
      setRows(data);
    } catch (e) { setErr(e.message); }
    finally { setLoading(false); }
  }
  async function runCodeSearch(e) {
    e?.preventDefault();
    if (!code.trim()) return;
    setLoading(true); setErr(""); setRows([]);
    try {
      const contracts = await supabaseRest(`contracts?device_code=eq.${encodeURIComponent(code.trim())}&branch_id=eq.${branchId}&select=contract_id`, { token });

            </div>

/* ============================================================================
 * Archive — สัญญาที่ปิดแล้ว (ผ่อนจบ/คืนเครื่อง/ยึดเครื่อง) ของสาขาที่เลือก
 * ==========================================================================*/
function ArchivePage({ t, token, branchId }) {
  const [rows, setRows] = useState([]);
  const [loading, setLoading] = useState(true);
  const [err, setErr] = useState("");
  const [search, setSearch] = useState("");
  const [statusFilter, setStatusFilter] = useState("all");

  useEffect(() => {
    if (!token || !branchId) return;
    let cancelled = false;
    (async () => {
      setLoading(true); setErr("");
      try {
        const data = await supabaseRest(`contracts?branch_id=eq.${branchId}&status=neq.active&select=*&order=start_date.desc&limit=500`, { token });
        if (!cancelled) setRows(data);
      } catch (e) { if (!cancelled) setErr(e.message); }
      finally { if (!cancelled) setLoading(false); }
    })();
    return () => { cancelled = true; };
  }, [token, branchId]);

  const filtered = rows.filter((r) => {
    if (statusFilter !== "all" && r.status !== statusFilter) return false;
    if (search.trim() && !r.device_code.toLowerCase().includes(search.trim().toLowerCase())) return false;
    return true;
  });

  const input = mkInput(t);
  return (
    <div>
      <PageHeader t={t} title="Archive" sub="สัญญาที่ปิดแล้ว (ผ่อนจบ / คืนเครื่อง / ยึดเครื่อง)" />

        <div style={{ flex: 1, minWidth: 160 }}>
          <label style={mkLabel(t)}>ค้นหารหัสลูกค้า</label>

        </div>
        <div style={{ minWidth: 160 }}>
          <label style={mkLabel(t)}>สถานะ</label>
          <select value={statusFilter} onChange={(e) => setStatusFilter(e.target.value)} style={{ ...input, cursor: "pointer" }}>
            <option value="all">ทั้งหมด</option>
            <option value="closed">ผ่อนจบ</option>
            <option value="returned">คืน/ยึดเครื่อง</option>
          </select>
        </div>
      </Card>
      <ErrBox t={t} msg={err} />
      <Card t={t} style={{ padding: 0, overflow: "hidden" }}>
        {loading ? <Loading t={t} /> : filtered.length === 0 ? (
          <div style={{ padding: 40, textAlign: "center", color: t.ink3, fontSize: 13.5 }}>ไม่มีรายการ</div>
        ) : (
          <table style={{ width: "100%", borderCollapse: "collapse", fontSize: 13.5 }}>
            <thead><tr style={{ background: t.surfaceAlt }}>
              {["contract_id", "รหัสลูกค้า", "วันที่เริ่ม", "งวด", "ยอด/งวด", "สถานะ"].map((h, i) => (
                <th key={i} style={{ textAlign: i === 4 ? "right" : "left", padding: "9px 14px", color: t.ink2, fontWeight: 500, fontSize: 11.5 }}>{h}</th>
              ))}
            </tr></thead>
            <tbody>
              {filtered.map((c) => (
                <tr key={c.contract_id} style={{ borderTop: `1px solid ${t.border}` }}>
                  <td style={{ padding: "9px 14px", fontFamily: "'IBM Plex Mono', monospace" }}>{c.contract_id}</td>
                  <td style={{ padding: "9px 14px", fontFamily: "'IBM Plex Mono', monospace" }}>{c.device_code}</td>
                  <td style={{ padding: "9px 14px", fontFamily: "'IBM Plex Mono', monospace" }}>{c.start_date}</td>
                  <td style={{ padding: "9px 14px", fontFamily: "'IBM Plex Mono', monospace" }}>{c.total_installments}</td>
                  <td style={{ padding: "9px 14px", textAlign: "right", fontFamily: "'IBM Plex Mono', monospace" }}>{Number(c.amount_per_installment).toLocaleString()}</td>
                  <td style={{ padding: "9px 14px" }}>
                    <span style={{ background: t[(c.status === "closed" ? "neutral" : "warn") + "Soft"], color: t[c.status === "closed" ? "neutral" : "warn"], borderRadius: 99, padding: "3px 10px", fontSize: 11.5, fontWeight: 600 }}>{STATUS_LABEL_TH[c.status]}</span>
                  </td>

              ))}
            </tbody>
          </table>
        )}
      </Card>

/* ============================================================================
 * ตรวจ+ซ่อมงวด — ค้นหาสัญญา ดูประวัติการจ่ายทั้งหมดเพื่อวินิจฉัยปัญหา (ยังเป็นโหมดดูอย่างเดียว
 * เพราะทั้งระบบยังไม่มีปุ่มแก้ไข/บันทึกข้อมูลจริงที่ไหนเลยในตอนนี้ — แก้ไขจริงต้องทำผ่าน SQL Editor
 * ของ Supabase โดยตรงไปก่อน จนกว่าจะสร้างปุ่มแก้ไขให้)
 * ==========================================================================*/
// แผนผังงวด — ตอบคำถาม "สัญญานี้จ่ายมาถึงงวดไหนแล้ว ขาดงวดไหน" ในภาพเดียว ใช้ logic เดียวกับที่
// หน้าตรวจสอบใช้ตัดสินสถานะจริง (maxCompletedAll/partSum) ไม่ใช่คำนวณแยกกันคนละชุด
function InstallmentGrid({ t, contract, history }) {
  const L = maxCompletedAll(history); // จ่ายครบเต็มถึงงวดนี้แล้ว
  const cells = [];
  for (let n = 1; n <= contract.total_installments; n++) {
    let state = "missing", label = "ยังไม่จ่าย";
    if (n <= L) { state = "paid"; label = "จ่ายครบแล้ว"; }
    else {
      const partial = partSum(history, n);
      if (partial > 0) { state = "partial"; label = `จ่ายบางส่วนแล้ว ${fmt(partial)} จาก ${fmt(Number(contract.amount_per_installment))}`; }
      else if (n === L + 1) { state = "next"; label = "งวดถัดไปที่ต้องจ่าย"; }
    }
    cells.push({ n, state, label });
  }
  const colors = {
    paid: { bg: t.ok, fg: "#fff" },
    partial: { bg: t.warn, fg: "#fff" },
    next: { bg: t.surface, fg: t.accent, border: t.accent },
    missing: { bg: t.surfaceAlt, fg: t.ink3 },
  };
  return (
    <Card t={t} style={{ marginBottom: 16 }}>
      <div style={{ fontWeight: 600, fontSize: 14.5, marginBottom: 4 }}>แผนผังงวด</div>
      <div style={{ fontSize: 12, color: t.ink2, marginBottom: 14 }}>
        จ่ายครบแล้วถึงงวดที่ <b style={{ color: t.ok }}>{L}</b> จากทั้งหมด {contract.total_installments} งวด
        {L < contract.total_installments && <> — งวดถัดไปที่ต้องจ่ายคืองวดที่ <b style={{ color: t.accent }}>{L + 1}</b></>}
      </div>
      <div style={{ display: "flex", flexWrap: "wrap", gap: 6 }}>
        {cells.map((c) => (
          <div key={c.n} title={`งวด ${c.n}: ${c.label}`} style={{
            width: 34, height: 34, borderRadius: 8, display: "flex", alignItems: "center", justifyContent: "center",
            background: colors[c.state].bg, color: colors[c.state].fg,
            border: colors[c.state].border ? `2px solid ${colors[c.state].border}` : "none",
            fontSize: 12.5, fontWeight: 700, fontFamily: "'IBM Plex Mono', monospace", flexShrink: 0,
          }}>{c.n}</div>
        ))}
      </div>
      <div style={{ display: "flex", gap: 16, marginTop: 14, flexWrap: "wrap", fontSize: 11.5, color: t.ink2 }}>
        <div style={{ display: "flex", alignItems: "center", gap: 6 }}><span style={{ width: 12, height: 12, borderRadius: 4, background: t.ok, display: "inline-block" }} />จ่ายครบแล้ว</div>
        <div style={{ display: "flex", alignItems: "center", gap: 6 }}><span style={{ width: 12, height: 12, borderRadius: 4, background: t.warn, display: "inline-block" }} />จ่ายบางส่วน</div>
        <div style={{ display: "flex", alignItems: "center", gap: 6 }}><span style={{ width: 12, height: 12, borderRadius: 4, background: t.surface, border: `2px solid ${t.accent}`, display: "inline-block" }} />งวดถัดไป</div>
        <div style={{ display: "flex", alignItems: "center", gap: 6 }}><span style={{ width: 12, height: 12, borderRadius: 4, background: t.surfaceAlt, display: "inline-block" }} />ยังไม่ถึงกำหนด</div>
      </div>
    </Card>
  );
}

function FixPage({ t, token, branchId }) {
  const [code, setCode] = useState("");
  const [contracts, setContracts] = useState(null);
  const [selected, setSelected] = useState(null);
  const [history, setHistory] = useState([]);
  const [loading, setLoading] = useState(false);
  const [err, setErr] = useState("");

  async function search(e) {
    e.preventDefault();
    if (!code.trim()) return;
    setLoading(true); setErr(""); setContracts(null); setSelected(null); setHistory([]);
    try {
      const rows = await supabaseRest(`contracts?device_code=eq.${encodeURIComponent(code.trim())}&branch_id=eq.${branchId}&select=*&order=start_date.desc`, { token });
      setContracts(rows);
      if (rows.length === 1) selectContract(rows[0]);
    } catch (e2) { setErr(e2.message); }
    finally { setLoading(false); }
  }
  async function selectContract(c) {
    setSelected(c); setHistory([]); setErr("");
    try {
      const h = await supabaseRest(`payments?contract_id=eq.${c.contract_id}&select=*&order=installment_number.asc`, { token });
      setHistory(h);
    } catch (e) { setErr(e.message); }
  }

  const input = mkInput(t);
  return (
    <div>
      <PageHeader t={t} title="ตรวจ + ซ่อมงวด" sub="ค้นหาสัญญาเพื่อดูประวัติการจ่ายทั้งหมด ใช้วินิจฉัยปัญหา (ยังดูได้อย่างเดียว แก้ไขยังไม่เปิดใช้)" />
      <Card t={t} style={{ marginBottom: 16 }}>
        <form onSubmit={search} style={{ display: "flex", gap: 10 }}>
          <input style={input} placeholder="รหัสลูกค้า เช่น 331" value={code} onChange={(e) => setCode(e.target.value)} />
          <button type="submit" style={{ background: t.accent, color: t.accentInk, border: "none", borderRadius: 8, padding: "9px 18px", fontSize: 13.5, fontWeight: 600, cursor: "pointer", fontFamily: "inherit", flexShrink: 0 }}>ค้นหา</button>
        </form>
      </Card>
      <ErrBox t={t} msg={err} />
      {loading && <Loading t={t} />}
      {contracts && contracts.length === 0 && <div style={{ color: t.ink3, fontSize: 13.5 }}>ไม่พบรหัสนี้ในสาขาที่เลือก</div>}
      {contracts && contracts.length > 1 && !selected && (
        <Card t={t}>
          <div style={{ fontSize: 13, color: t.ink2, marginBottom: 10 }}>รหัสนี้ถูกใช้ซ้ำ {contracts.length} สัญญา — เลือกสัญญาที่ต้องการดู</div>
          <div style={{ display: "flex", flexDirection: "column", gap: 8 }}>
            {contracts.map((c) => (
              <button key={c.contract_id} onClick={() => selectContract(c)} style={{ textAlign: "left", background: t.surfaceAlt, border: `1px solid ${t.border}`, borderRadius: 10, padding: 12, cursor: "pointer", fontFamily: "inherit", color: t.ink }}>
                #{c.contract_id} — เริ่ม {c.start_date} — {c.total_installments} งวด × {Number(c.amount_per_installment).toLocaleString()} — {STATUS_LABEL_TH[c.status]}
              </button>
            ))}
          </div>
        </Card>
      )}
      {selected && (
        <>
          <Card t={t} style={{ marginBottom: 16 }}>
            <div style={{ display: "flex", gap: 20, flexWrap: "wrap", fontSize: 13.5 }}>
              <div><span style={{ color: t.ink2 }}>contract_id: </span><b>{selected.contract_id}</b></div>
              <div><span style={{ color: t.ink2 }}>เริ่ม: </span><b>{selected.start_date}</b></div>
              <div><span style={{ color: t.ink2 }}>งวดทั้งหมด: </span><b>{selected.total_installments}</b></div>
              <div><span style={{ color: t.ink2 }}>ยอด/งวด: </span><b>{Number(selected.amount_per_installment).toLocaleString()}</b></div>
              <div><span style={{ color: t.ink2 }}>สถานะ: </span><b>{STATUS_LABEL_TH[selected.status]}</b></div>
            </div>
          </Card>
          <InstallmentGrid t={t} contract={selected} history={history} />
          <Card t={t} style={{ padding: 0, overflow: "hidden" }}>
            {history.length === 0 ? (
              <div style={{ padding: 40, textAlign: "center", color: t.ink3, fontSize: 13.5 }}>ยังไม่มีประวัติการจ่ายของสัญญานี้</div>
            ) : (
              <table style={{ width: "100%", borderCollapse: "collapse", fontSize: 13.5 }}>
                <thead><tr style={{ background: t.surfaceAlt }}>
                  {["งวดที่", "ประเภท", "จำนวนเงิน", "วันที่จ่าย"].map((h, i) => (
                    <th key={i} style={{ textAlign: i === 2 ? "right" : "left", padding: "9px 14px", color: t.ink2, fontWeight: 500, fontSize: 11.5 }}>{h}</th>
                  ))}
                </tr></thead>
                <tbody>
