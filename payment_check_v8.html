/* ============================================================================
 * ตรรกะตรวจสอบ — ย้ายมาจากระบบเดิม (parsePeriod / computePeriodResult_ / nestedStatus)
 * เกือบทั้งหมดคัดลอกตรงๆ ไม่ได้แก้ตรรกะเลย ต่างแค่แหล่งข้อมูล: เดิมอ่านจากแถว Working
 * Reference สะสมทั้งชีท ตอนนี้ดึง "ประวัติการจ่ายของสัญญานั้น" จากตาราง payments จริงแทน
 * ==========================================================================*/
function parsePeriod(raw) {
  if (raw === null || raw === undefined || raw === "") return null;
  const clean = String(raw).trim().replace(/\s+/g, "");
  const hasParen = clean.includes("(");
  const base = hasParen ? clean.substring(0, clean.indexOf("(")) : clean;
  const status = hasParen ? clean.substring(clean.indexOf("(") + 1, clean.length - 1) : "";
  const hasDash = base.includes("-");
  let start, end;
  if (hasDash) {
    const parts = base.split("-");
    start = parseFloat(parts[0]); end = parseFloat(parts[1]);
  } else {
    start = parseFloat(base); end = start;
  }
  const numOK = !isNaN(start) && !isNaN(end);
  const fmtOK = numOK &&
    (status === "" || status === "สะสม" || status === "บางส่วน" || status === "ครบ" || status === "จบ") &&
    start >= 1 && end >= start &&
    (hasDash ? end > start : true) &&
    !(hasDash && status === "ครบ") &&
    start > 0 && end > 0;
  return { clean, hasParen, base, status, hasDash, start, end, fmtOK };
}

// เทียบเท่า periodsCompleted(p) ของเดิม แต่อ่านจากแถว payments จริง (installment_number/
// payment_type แยกฟิลด์ชัดเจนอยู่แล้ว) แทนการแกะจากข้อความ label รวมแบบเดิม ผลลัพธ์เหมือนกันทุกกรณี
function periodsCompletedFromPayment(h) {
  if (!h.payment_type) return h.installment_number; // งวดปกติไม่มีสถานะพิเศษ = ครบเต็มงวด
  if (h.payment_type.includes("ครบ") || h.payment_type.includes("จบ")) return h.installment_number;
  return null; // บางส่วน/สะสม ยังไม่นับว่าครบ
}
function fmt(n) { return Math.round(n).toLocaleString("th-TH"); }
function maxCompletedAll(history) {
  let m = 0;
  for (const h of history) { const c = periodsCompletedFromPayment(h); if (c !== null && c > m) m = c; }
  return m;
}
function lastOKBefore(history, start) {
  let m = 0;
  for (const h of history) { const c = periodsCompletedFromPayment(h); if (c !== null && c < start && c > m) m = c; }
  return m;
}
function partSum(history, start) {
  let s = 0;
  for (const h of history) {
    if (h.installment_number === start && (h.payment_type === "สะสม" || h.payment_type === "บางส่วน")) s += Number(h.amount) || 0;
  }
  return s;
}
function skipNote(start, J) {
  const diff = start - J - 1;
  if (diff === 1) return `ขาดงวด ${J + 1}`;
  if (diff > 1) return `ขาดงวด ${J + 1}-${start - 1}`;
  return "";
}

// ตรรกะเทียบยอด/งวดหลัก — คัดลอกมาจากระบบเดิมทั้งหมด ไม่ได้แก้แม้แต่บรรทัดเดียว
function computePeriodResult_(p, C, I, K, J) {
  if (!p.hasDash && p.status === "") {
    if (p.start !== J + 1) return { status: "ข้ามงวด", note: skipNote(p.start, J) };
    if (K + C === I) return { status: "ถูก", note: "" };
    if (K + C > I) return { status: "ยอดเกิน", note: "" };
    return { status: "จำนวนเงินไม่ตรง", note: `ควรเป็น ${fmt(I - K)}` };
  }
  if (p.status === "สะสม" || p.status === "บางส่วน") {
    if (p.start !== J + 1) return { status: "ข้ามงวด", note: skipNote(p.start, J) };
    if (I === 0) return { status: "รอครบงวด", note: "" };
    if (K + C > I) return { status: "ยอดเกิน", note: "" };
    if (K + C === I) return { status: "ถูก", note: "" };
    return { status: "รอครบงวด", note: "" };
  }
  if (p.status === "ครบ") {
    if (p.start !== J + 1) return { status: "ข้ามงวด", note: skipNote(p.start, J) };
    if (K === 0) return { status: "รูปแบบงวดไม่ถูกต้อง", note: "ใช้ (ครบ) แต่ไม่มียอดสะสม/บางส่วนของงวดนี้มาก่อน ตรวจสอบว่ากรอกถูกงวดหรือควรใช้ (บางส่วน)/(สะสม) แทน" };
    if (K + C === I) return { status: "ถูก", note: "" };
    if (K + C > I) return { status: "ยอดเกิน", note: "" };
    return { status: "จำนวนเงินไม่ตรง", note: `ควรเป็น ${fmt(I - K)}` };
  }
  if ((p.hasDash && p.status === "") || (p.hasDash && p.status === "จบ") || (!p.hasDash && p.status === "จบ")) {
    if (p.start !== J + 1) return { status: "ข้ามงวด", note: skipNote(p.start, J) };
    const G = p.hasDash ? p.end : p.start;
    const eligibleForDiscount = p.status === "จบ" && J <= 5;
    const periodCount = G - p.start + 1;
    const fullExpected = periodCount * I - K;
    const discountedExpected = periodCount * I * 0.9 - K;
    const matchesFull = Math.abs(C - fullExpected) < 0.005;
    const matchesDiscount = eligibleForDiscount && Math.abs(C - discountedExpected) < 0.005;
    if (matchesFull || matchesDiscount) {
      let note = (p.hasDash && p.status === "จบ") ? "ชำระหลายงวดพร้อมจบสัญญา" : "";
      if (matchesDiscount) note += (note ? " — " : "") + "ใช้ส่วนลด 10%";
      return { status: "ถูก", note };
    }
    const expectedNote = eligibleForDiscount
      ? `ควรเป็น ${fmt(fullExpected)} (เต็มราคา) หรือ ${fmt(discountedExpected)} (ลด 10%)`
      : `ควรเป็น ${fmt(fullExpected)}`;
    return { status: "จำนวนเงินไม่ตรง", note: expectedNote };
  }
  return { status: "รูปแบบงวดไม่ถูกต้อง", note: "" };
}

// ค้นหาสัญญาของรหัสนี้จากฐานข้อมูลจริง — ถ้ามีหลายสัญญา (รหัสถูกใช้ซ้ำ) เลือกตัวที่ status=active

async function fetchContractForCode(token, branchId, deviceCode) {
  const rows = await supabaseRest(
    `contracts?device_code=eq.${encodeURIComponent(deviceCode)}&branch_id=eq.${encodeURIComponent(branchId)}&select=*&order=start_date.desc`,
    { token }
  );
  if (!rows.length) return null;
  return rows.find((c) => c.status === "active") || rows[0];
}

// ดึงประวัติการจ่ายทั้งหมดของสัญญานี้ (แทนการไล่อ่านแถว Working Reference ของรหัสนี้ทั้งชีทแบบเดิม)
async function fetchPaymentHistory(token, contractId) {
  return await supabaseRest(
    `payments?contract_id=eq.${contractId}&select=installment_number,payment_type,amount,payment_date&order=installment_number.asc`,
    { token }
  );
}

// เช็คจ่ายซ้ำ (งวด+ประเภท+ยอด+วันที่ตรงกันเป๊ะ) — รวม Working Reference/Archive เดิมเป็นแหล่งเดียว
// เพราะระบบใหม่ไม่แยกสองที่เก็บแล้ว (status ของสัญญาบอกอยู่แล้วว่าปิด/เปิดอยู่)
function findDuplicateInHistory(history, p, C, dateStr) {
  return history.some((h) => (h.payment_type || null) === (p.status || null) &&
    h.installment_number === p.start && Number(h.amount) === C && h.payment_date === dateStr);
}

async function nestedStatus(contract, p, C, history) {
  const L = maxCompletedAll(history);
  if (L >= p.start) return { status: "งวดนี้จ่ายครบไปแล้ว", note: `ลูกค้าชำระถึงงวด ${L} แล้ว ตรวจสอบว่าใส่งวด/รหัสลูกค้าผิดหรือไม่` };

  if (contract.total_installments > 0) {
    const reachedPeriod = p.hasDash ? p.end : p.start;
    if (reachedPeriod > contract.total_installments) {
      return { status: "เกินจำนวนงวดสัญญา", note: `สัญญาของลูกค้ารายนี้กำหนดไว้ ${contract.total_installments} งวด แต่รายการนี้เป็นงวดที่ ${reachedPeriod} — ตรวจสอบว่าใส่งวด/รหัสลูกค้าผิด หรือมีการต่อ/แก้ไขสัญญาโดยไม่ได้อัปเดตข้อมูลสัญญา` };
    }
  }
  const J = lastOKBefore(history, p.start);
  const I = Number(contract.amount_per_installment);
  const K = partSum(history, p.start);
  return computePeriodResult_(p, C, I, K, J);
}

async function checkRowLive(row, priorRowsInBatch, token, branchId, contractCache, checkDate) {
  const code = row.code.trim();
  const amount = parseFloat(row.amount);
  const hasAmount = row.amount && row.amount.trim() !== "";
  const hasFee = row.fee && row.fee.trim() !== "";
  const hasCum = row.cum && row.cum.trim() !== "";
  const hasPeriod = row.period && row.period.trim() !== "";

  const allEmpty = !code && !hasPeriod && !hasAmount && !hasFee && !hasCum;
  if (allEmpty) return { status: "", tone: "neutral" };

  // แถวที่มีแค่ "ค่าธรรมเนียม" และ/หรือ "สะสม" โดยไม่มีงวด/จำนวนเงิน — เป็นรายการพิเศษที่ไม่ผูก
  // เข้าสถานะสัญญาปกติ (นับรวมยอดวันนั้นได้ แต่ไม่ตรวจซ้ำ/ไม่บันทึกเข้าประวัติการจ่ายงวด) ย้ายมา
  // จากระบบเดิมทั้งชุด ต้องเช็คคู่ค่าธรรมเนียม+สะสมก่อนเช็คแยกทีละอย่าง ไม่งั้นยอดสะสมจะหายไปเงียบๆ
  const feeCumOnly = !hasPeriod && !hasAmount && hasFee && hasCum;
  if (feeCumOnly) {
    const note = code
      ? `ค่าธรรมเนียม+สะสมเพิ่มเติมผูกกับรหัสลูกค้า ${code} (ไม่บันทึกเข้าประวัติงวด)`
      : "รายการค่าธรรมเนียม+สะสมพร้อมกัน ไม่ผูกกับรหัสลูกค้า";
    return { status: "ค่าธรรมเนียม+สะสมเพิ่มเติม", tone: "info", note, feeAmount: parseFloat(row.fee) || 0, cumAmount: parseFloat(row.cum) || 0 };
  }
  if (!hasPeriod && !hasAmount && !hasFee && hasCum) {
    const note = code ? `สะสมเพิ่มเติมผูกกับรหัสลูกค้า ${code} (ไม่บันทึกเข้าประวัติงวด)` : "รายการยอดสะสมเดี่ยว ไม่ผูกกับรหัสลูกค้า";
    return { status: "สะสมเพิ่มเติม", tone: "info", note, amount: parseFloat(row.cum) || 0 };
  }
  if (!hasPeriod && !hasAmount && hasFee) {
    const note = code ? `ค่าธรรมเนียมเพิ่มเติมผูกกับรหัสลูกค้า ${code} (ไม่บันทึกเข้าประวัติงวด)` : "รายการค่าธรรมเนียมเดี่ยว ไม่ผูกกับรหัสลูกค้า";
    return { status: "ค่าธรรมเนียมเพิ่มเติม", tone: "info", note, amount: parseFloat(row.fee) || 0 };
  }

  if (!code || !row.period || !row.amount) return { status: "", tone: "neutral" };

  const dupInBatch = priorRowsInBatch.some(
    (r) => r.code.trim() === code && r.period.trim() === row.period.trim() && parseFloat(r.amount) === amount
  );
  if (dupInBatch) return { status: "ซ้ำในรายการตรวจ", tone: "warn" };

  const p = parsePeriod(row.period);
  if (!p || !p.fmtOK) return { status: "รูปแบบงวดไม่ถูกต้อง", tone: "bad" };

  let entry = contractCache.current.get(code);
  if (entry === undefined) {
    try {
      const contract = await fetchContractForCode(token, branchId, code);
      const history = contract ? await fetchPaymentHistory(token, contract.contract_id) : [];
      entry = { contract, history };
    } catch (e) {
      return { status: `เชื่อมต่อไม่สำเร็จ: ${e.message}`, tone: "bad" };
    }
    contractCache.current.set(code, entry);
  }
  const { contract, history } = entry;

  if (!contract) return { status: "ไม่พบข้อมูลลูกค้า", tone: "bad" };
  if (contract.status !== "active") {
    return { status: `สัญญานี้ปิดแล้ว (${contract.status === "closed" ? "ผ่อนจบ" : "คืนเครื่อง"})`, tone: "warn", note: "ลูกค้ารายนี้เคยผ่อนจบ/คืนเครื่องไปแล้ว ตรวจสอบว่าเป็นสัญญาใหม่หรือรายการผิดพลาด" };
  }
  if (isNaN(amount) || amount <= 0) return { status: "จำนวนเงินไม่ถูกต้อง", tone: "bad" };
  if (findDuplicateInHistory(history, p, amount, checkDate)) return { status: "ซ้ำ", tone: "warn" };

  const result = await nestedStatus(contract, p, amount, history);
  return { status: result.status, note: result.note, tone: STATUS_TONE[result.status] || "bad", contractId: contract.contract_id, installmentNumber: p.start, paymentType: p.status || null };
}
const TONE_DOT = { ok: "●", warn: "●", bad: "●", info: "●", neutral: "●", loading: "○" };

// สาขาที่มีข้อมูลจริงอยู่ในฐานข้อมูลตอนนี้มีแค่ "surat" (จากการย้ายข้อมูลที่ทำไปก่อนหน้า)
// สาขาอื่นยังไม่ได้ทำ ใส่ไว้ในตัวเลือกเผื่ออนาคตแต่ตอนนี้จะไม่พบข้อมูลใดๆ
const BRANCH_ID_MAP = { "สุราษฎร์ธานี": "surat", "สมุย": "samui", "หลังสวน": "langsuan" };

// ตรวจทีละแถวตามลำดับ (ไม่ขนาน) เพราะการเช็ค "ซ้ำในรายการตรวจ" ต้องรู้ผลของแถวก่อนหน้า
// ก่อนเสมอ — cache ผลค้นหาสัญญา+ประวัติต่อรหัสไว้ใน session เดียวกัน ไม่ต้องยิงซ้ำถ้าเจอรหัสเดิมหลายแถว
function useComputedRows(rows, token, branchId, checkDate) {
  const [results, setResults] = useState({});
  const contractCache = useRef(new Map());

  useEffect(() => {
    if (!token) return;
    let cancelled = false;
    contractCache.current = new Map();
    (async () => {
      for (let i = 0; i < rows.length; i++) {
        const r = rows[i];
        setResults((prev) => ({ ...prev, [r.id]: { status: "", tone: "loading" } }));
      }
      for (let i = 0; i < rows.length; i++) {
        const r = rows[i];
        const res = await checkRowLive(r, rows.slice(0, i), token, branchId, contractCache, checkDate);
        if (cancelled) return;
        setResults((prev) => ({ ...prev, [r.id]: res }));
      }
    })();
    return () => { cancelled = true; };

  }, [rows, token, branchId, checkDate]);

  return rows.map((r) => ({ ...r, result: results[r.id] || { status: "", tone: "neutral" } }));
}

// query string แบบระบบเดิมอีกแล้ว เป็น POST body เข้ารหัส TLS ทั้งหมด)
// ---------------------------------------------------------------------------
async function resolveEmailForUsername(username) {
  const email = await supabaseRpc("get_email_for_username", { p_username: username.trim() });
  if (!email) throw new Error("ไม่พบรหัสผู้ใช้นี้ในระบบ");
  return email;
}

/* ============================================================================
 * ตัวช่วยสไตล์ใช้ร่วมกันหลายหน้า (แยกจาก CheckPage เพราะ component พวกนี้อยู่นอกฟังก์ชันนั้น)

function mkInput(t) {
  return { width: "100%", padding: "9px 11px", borderRadius: 8, border: `1px solid ${t.border}`, background: t.surface, color: t.ink, fontSize: 14, fontFamily: "'IBM Plex Mono', monospace", outline: "none", boxSizing: "border-box" };
}
function mkLabel(t) {
  return { fontSize: 12, color: t.ink2, marginBottom: 5, display: "block", fontWeight: 500 };
}
function PageHeader({ t, title, sub }) {
  return (
    <div style={{ marginBottom: 20 }}>
      <h1 style={{ fontSize: 21, fontWeight: 700, margin: "0 0 3px", letterSpacing: -0.3 }}>{title}</h1>
      {sub && <div style={{ fontSize: 12.5, color: t.ink2 }}>{sub}</div>}
    </div>
  );
}
function Card({ t, children, style }) {
  return <div style={{ background: t.surface, border: `1px solid ${t.border}`, borderRadius: 14, padding: 18, boxShadow: t.shadow, ...style }}>{children}</div>;
}
function ErrBox({ t, msg }) {
  if (!msg) return null;
  return <div style={{ background: t.badSoft, color: t.bad, borderRadius: 8, padding: "10px 12px", fontSize: 12.5, marginBottom: 14 }}>{msg}</div>;
}
function Loading({ t }) {
  return <div style={{ padding: 40, textAlign: "center", color: t.ink3, fontSize: 13.5, display: "flex", alignItems: "center", justifyContent: "center", gap: 8 }}><Loader2 size={15} className="spin" /> กำลังโหลด...</div>;
}
const STATUS_LABEL_TH = { active: "ผ่อนอยู่", closed: "ผ่อนจบ", returned: "คืน/ยึดเครื่อง" };

/* ============================================================================
 * Dashboard — สรุปภาพรวมสัญญาของสาขาที่เลือก
 * ==========================================================================*/
function DashboardPage({ t, token, branchId }) {
  const [stats, setStats] = useState(null);
  const [loading, setLoading] = useState(true);
  const [err, setErr] = useState("");
  const [search, setSearch] = useState("");
  const [searchResult, setSearchResult] = useState(null);
  const [searching, setSearching] = useState(false);

  useEffect(() => {
    if (!token || !branchId) return;
    let cancelled = false;
    (async () => {
      setLoading(true); setErr("");
      try {
        const [active, closed, returned] = await Promise.all([
          supabaseRest(`contracts?branch_id=eq.${branchId}&status=eq.active&select=contract_id`, { token }),
          supabaseRest(`contracts?branch_id=eq.${branchId}&status=eq.closed&select=contract_id`, { token }),
          supabaseRest(`contracts?branch_id=eq.${branchId}&status=eq.returned&select=contract_id`, { token }),
        ]);
        if (cancelled) return;
        setStats({ active: active.length, closed: closed.length, returned: returned.length });
      } catch (e) { if (!cancelled) setErr(e.message); }
      finally { if (!cancelled) setLoading(false); }
    })();
    return () => { cancelled = true; };
  }, [token, branchId]);

  async function doSearch(e) {
    e.preventDefault();
    if (!search.trim()) return;
    setSearching(true); setSearchResult(null); setErr("");
    try {
      const contracts = await supabaseRest(`contracts?device_code=eq.${encodeURIComponent(search.trim())}&branch_id=eq.${branchId}&select=*&order=start_date.desc`, { token });
      setSearchResult(contracts);
    } catch (e2) { setErr(e2.message); }
    finally { setSearching(false); }
  }

  const input = mkInput(t), label = mkLabel(t);
  const statCard = (icon, lbl, value, tone) => (
    <Card t={t} style={{ flex: 1, minWidth: 140 }}>
      <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", marginBottom: 10 }}>
        <span style={{ fontSize: 12, color: t.ink2, fontWeight: 500 }}>{lbl}</span>
        <div style={{ width: 26, height: 26, borderRadius: 8, background: t[tone + "Soft"], display: "flex", alignItems: "center", justifyContent: "center" }}>{icon}</div>
      </div>
      <div style={{ fontSize: 24, fontWeight: 700, fontFamily: "'IBM Plex Mono', monospace" }}>{value}</div>
    </Card>
  );

  return (
    <div>
      <PageHeader t={t} title="Dashboard" sub="ภาพรวมสัญญาของสาขาที่เลือกไว้" />
      <ErrBox t={t} msg={err} />
      {loading ? <Loading t={t} /> : stats && (
        <div style={{ display: "flex", gap: 14, marginBottom: 20, flexWrap: "wrap" }}>
          {statCard(<ClipboardCheck size={13} color={t.ok} />, "ผ่อนอยู่ (active)", stats.active, "ok")}
          {statCard(<Archive size={13} color={t.neutral} />, "ผ่อนจบ (closed)", stats.closed, "neutral")}
          {statCard(<AlertTriangle size={13} color={t.warn} />, "คืน/ยึดเครื่อง", stats.returned, "warn")}
          {statCard(<Database size={13} color={t.accent} />, "รวมทั้งหมด", stats.active + stats.closed + stats.returned, "accent")}
        </div>
      )}
      <Card t={t}>
        <div style={{ fontWeight: 600, fontSize: 14.5, marginBottom: 12 }}>ค้นหาสัญญาด้วยรหัสลูกค้า</div>
        <form onSubmit={doSearch} style={{ display: "flex", gap: 10, marginBottom: searchResult ? 16 : 0 }}>
          <input style={input} placeholder="เช่น 9" value={search} onChange={(e) => setSearch(e.target.value)} />
          <button type="submit" disabled={searching} style={{ background: t.accent, color: t.accentInk, border: "none", borderRadius: 8, padding: "9px 18px", fontSize: 13.5, fontWeight: 600, cursor: "pointer", fontFamily: "inherit", flexShrink: 0 }}>ค้นหา</button>
        </form>
        {searchResult && (
          searchResult.length === 0 ? <div style={{ color: t.ink3, fontSize: 13 }}>ไม่พบรหัสนี้ในสาขาที่เลือก</div> : (
            <div style={{ display: "flex", flexDirection: "column", gap: 8 }}>
              {searchResult.map((c) => (
                <div key={c.contract_id} style={{ border: `1px solid ${t.border}`, borderRadius: 10, padding: 12, display: "flex", alignItems: "center", gap: 14, flexWrap: "wrap" }}>
                  <span style={{ fontFamily: "'IBM Plex Mono', monospace", fontWeight: 600 }}>#{c.contract_id}</span>
                  <span style={{ fontSize: 12.5, color: t.ink2 }}>เริ่ม {c.start_date}</span>
                  <span style={{ fontSize: 12.5, color: t.ink2 }}>{c.total_installments} งวด × {Number(c.amount_per_installment).toLocaleString()} บาท</span>
                  <span style={{ marginLeft: "auto", background: t[(c.status === "active" ? "ok" : c.status === "closed" ? "neutral" : "warn") + "Soft"], color: t[c.status === "active" ? "ok" : c.status === "closed" ? "neutral" : "warn"], borderRadius: 99, padding: "3px 10px", fontSize: 11.5, fontWeight: 600 }}>{STATUS_LABEL_TH[c.status]}</span>
                </div>
              ))}
            </div>
          )
        )}
      </Card>
    </div>
  );
}

/* ============================================================================
 * Working Reference — ประวัติการจ่ายเงินล่าสุด ค้นหาตามรหัสลูกค้า หรือดูตามวันที่
 * ==========================================================================*/
function WRPage({ t, token, branchId }) {
  const [mode, setMode] = useState("date"); // 'date' หรือ 'code'
  const [date, setDate] = useState(() => new Date().toISOString().slice(0, 10));
  const [code, setCode] = useState("");
  const [rows, setRows] = useState([]);
  const [loading, setLoading] = useState(false);
  const [err, setErr] = useState("");

  async function runDateSearch() {
    setLoading(true); setErr(""); setRows([]);
    try {
      const data = await supabaseRest(`payments?payment_date=eq.${date}&select=payment_id,contract_id,installment_number,payment_type,amount,payment_date&order=payment_id.desc&limit=300`, { token });
      setRows(data);
    } catch (e) { setErr(e.message); }
    finally { setLoading(false); }
  }
  async function runCodeSearch(e) {
    e?.preventDefault();
    if (!code.trim()) return;
    setLoading(true); setErr(""); setRows([]);
    try {
      const contracts = await supabaseRest(`contracts?device_code=eq.${encodeURIComponent(code.trim())}&branch_id=eq.${branchId}&select=contract_id`, { token });
      if (!contracts.length) { setErr("ไม่พบรหัสนี้ในสาขาที่เลือก"); return; }
      const ids = contracts.map((c) => c.contract_id).join(",");
      const data = await supabaseRest(`payments?contract_id=in.(${ids})&select=payment_id,contract_id,installment_number,payment_type,amount,payment_date&order=payment_date.desc`, { token });
      setRows(data);
    } catch (e) { setErr(e.message); }
    finally { setLoading(false); }
  }

  useEffect(() => { if (token && mode === "date") runDateSearch(); }, [token, date, mode]);

  const input = mkInput(t), label = mkLabel(t);
  return (
    <div>
      <PageHeader t={t} title="Working Reference" sub="ประวัติการรับชำระเงินที่บันทึกไว้จริงในฐานข้อมูล" />
      <Card t={t} style={{ marginBottom: 16 }}>
        <div style={{ display: "flex", gap: 8, marginBottom: 14 }}>
          <button onClick={() => setMode("date")} style={{ background: mode === "date" ? t.accent : "transparent", color: mode === "date" ? t.accentInk : t.ink, border: `1px solid ${mode === "date" ? t.accent : t.border}`, borderRadius: 8, padding: "6px 14px", fontSize: 12.5, cursor: "pointer", fontFamily: "inherit", fontWeight: 600 }}>ดูตามวันที่</button>
          <button onClick={() => setMode("code")} style={{ background: mode === "code" ? t.accent : "transparent", color: mode === "code" ? t.accentInk : t.ink, border: `1px solid ${mode === "code" ? t.accent : t.border}`, borderRadius: 8, padding: "6px 14px", fontSize: 12.5, cursor: "pointer", fontFamily: "inherit", fontWeight: 600 }}>ค้นหาตามรหัสลูกค้า</button>
        </div>
        {mode === "date" ? (
          <div style={{ maxWidth: 200 }}>
            <label style={label}>วันที่</label>
            <input type="date" style={input} value={date} onChange={(e) => setDate(e.target.value)} />
          </div>
        ) : (
          <form onSubmit={runCodeSearch} style={{ display: "flex", gap: 10 }}>
            <input style={input} placeholder="รหัสลูกค้า เช่น 9" value={code} onChange={(e) => setCode(e.target.value)} />
            <button type="submit" style={{ background: t.accent, color: t.accentInk, border: "none", borderRadius: 8, padding: "9px 18px", fontSize: 13.5, fontWeight: 600, cursor: "pointer", fontFamily: "inherit", flexShrink: 0 }}>ค้นหา</button>
          </form>
        )}
      </Card>
      <ErrBox t={t} msg={err} />
      <Card t={t} style={{ padding: 0, overflow: "hidden" }}>
        {loading ? <Loading t={t} /> : rows.length === 0 ? (
          <div style={{ padding: 40, textAlign: "center", color: t.ink3, fontSize: 13.5 }}>ไม่มีรายการ</div>
        ) : (
          <table style={{ width: "100%", borderCollapse: "collapse", fontSize: 13.5 }}>
            <thead><tr style={{ background: t.surfaceAlt }}>
              {["contract_id", "งวดที่", "ประเภท", "จำนวนเงิน", "วันที่จ่าย"].map((h, i) => (
                <th key={i} style={{ textAlign: i === 3 ? "right" : "left", padding: "9px 14px", color: t.ink2, fontWeight: 500, fontSize: 11.5 }}>{h}</th>
              ))}
            </tr></thead>
            <tbody>
              {rows.map((r) => (
                <tr key={r.payment_id} style={{ borderTop: `1px solid ${t.border}` }}>
                  <td style={{ padding: "9px 14px", fontFamily: "'IBM Plex Mono', monospace" }}>{r.contract_id}</td>
                  <td style={{ padding: "9px 14px", fontFamily: "'IBM Plex Mono', monospace" }}>{r.installment_number}</td>
                  <td style={{ padding: "9px 14px" }}>{r.payment_type || "—"}</td>
                  <td style={{ padding: "9px 14px", textAlign: "right", fontFamily: "'IBM Plex Mono', monospace" }}>{Number(r.amount).toLocaleString()}</td>
                  <td style={{ padding: "9px 14px", fontFamily: "'IBM Plex Mono', monospace" }}>{r.payment_date}</td>
                </tr>
              ))}
            </tbody>
          </table>
        )}
      </Card>
    </div>
  );
}

                  <td style={{ padding: "9px 14px", fontFamily: "'IBM Plex Mono', monospace" }}>{c.contract_id}</td>
                  <td style={{ padding: "9px 14px", fontFamily: "'IBM Plex Mono', monospace" }}>{c.device_code}</td>
                  <td style={{ padding: "9px 14px", fontFamily: "'IBM Plex Mono', monospace" }}>{c.start_date}</td>
                  <td style={{ padding: "9px 14px", fontFamily: "'IBM Plex Mono', monospace" }}>{c.total_installments}</td>
                  <td style={{ padding: "9px 14px", textAlign: "right", fontFamily: "'IBM Plex Mono', monospace" }}>{Number(c.amount_per_installment).toLocaleString()}</td>
                  <td style={{ padding: "9px 14px" }}>
                    <span style={{ background: t[(c.status === "closed" ? "neutral" : "warn") + "Soft"], color: t[c.status === "closed" ? "neutral" : "warn"], borderRadius: 99, padding: "3px 10px", fontSize: 11.5, fontWeight: 600 }}>{STATUS_LABEL_TH[c.status]}</span>
                  </td>
                </tr>
              ))}
            </tbody>
          </table>
        )}
      </Card>
    </div>
  );
}

/* ============================================================================
 * ตรวจ+ซ่อมงวด — ค้นหาสัญญา ดูประวัติการจ่ายทั้งหมดเพื่อวินิจฉัยปัญหา (ยังเป็นโหมดดูอย่างเดียว
 * เพราะทั้งระบบยังไม่มีปุ่มแก้ไข/บันทึกข้อมูลจริงที่ไหนเลยในตอนนี้ — แก้ไขจริงต้องทำผ่าน SQL Editor
 * ของ Supabase โดยตรงไปก่อน จนกว่าจะสร้างปุ่มแก้ไขให้)
 * ==========================================================================*/
function FixPage({ t, token, branchId }) {
  const [code, setCode] = useState("");
  const [contracts, setContracts] = useState(null);
  const [selected, setSelected] = useState(null);
  const [history, setHistory] = useState([]);
  const [loading, setLoading] = useState(false);
  const [err, setErr] = useState("");

  async function search(e) {
    e.preventDefault();
    if (!code.trim()) return;
    setLoading(true); setErr(""); setContracts(null); setSelected(null); setHistory([]);
    try {
      const rows = await supabaseRest(`contracts?device_code=eq.${encodeURIComponent(code.trim())}&branch_id=eq.${branchId}&select=*&order=start_date.desc`, { token });
      setContracts(rows);
      if (rows.length === 1) selectContract(rows[0]);
    } catch (e2) { setErr(e2.message); }
    finally { setLoading(false); }
  }
  async function selectContract(c) {
    setSelected(c); setHistory([]); setErr("");
    try {
      const h = await supabaseRest(`payments?contract_id=eq.${c.contract_id}&select=*&order=installment_number.asc`, { token });
      setHistory(h);
    } catch (e) { setErr(e.message); }
  }

  const input = mkInput(t);
  return (
    <div>
      <PageHeader t={t} title="ตรวจ + ซ่อมงวด" sub="ค้นหาสัญญาเพื่อดูประวัติการจ่ายทั้งหมด ใช้วินิจฉัยปัญหา (ยังดูได้อย่างเดียว แก้ไขยังไม่เปิดใช้)" />
      <Card t={t} style={{ marginBottom: 16 }}>
        <form onSubmit={search} style={{ display: "flex", gap: 10 }}>
          <input style={input} placeholder="รหัสลูกค้า เช่น 331" value={code} onChange={(e) => setCode(e.target.value)} />
          <button type="submit" style={{ background: t.accent, color: t.accentInk, border: "none", borderRadius: 8, padding: "9px 18px", fontSize: 13.5, fontWeight: 600, cursor: "pointer", fontFamily: "inherit", flexShrink: 0 }}>ค้นหา</button>
        </form>
      </Card>
      <ErrBox t={t} msg={err} />
      {loading && <Loading t={t} />}
      {contracts && contracts.length === 0 && <div style={{ color: t.ink3, fontSize: 13.5 }}>ไม่พบรหัสนี้ในสาขาที่เลือก</div>}
      {contracts && contracts.length > 1 && !selected && (
        <Card t={t}>
          <div style={{ fontSize: 13, color: t.ink2, marginBottom: 10 }}>รหัสนี้ถูกใช้ซ้ำ {contracts.length} สัญญา — เลือกสัญญาที่ต้องการดู</div>
          <div style={{ display: "flex", flexDirection: "column", gap: 8 }}>
            {contracts.map((c) => (
              <button key={c.contract_id} onClick={() => selectContract(c)} style={{ textAlign: "left", background: t.surfaceAlt, border: `1px solid ${t.border}`, borderRadius: 10, padding: 12, cursor: "pointer", fontFamily: "inherit", color: t.ink }}>
                #{c.contract_id} — เริ่ม {c.start_date} — {c.total_installments} งวด × {Number(c.amount_per_installment).toLocaleString()} — {STATUS_LABEL_TH[c.status]}
              </button>
            ))}
          </div>
        </Card>
      )}
      {selected && (
        <>
          <Card t={t} style={{ marginBottom: 16 }}>
            <div style={{ display: "flex", gap: 20, flexWrap: "wrap", fontSize: 13.5 }}>
              <div><span style={{ color: t.ink2 }}>contract_id: </span><b>{selected.contract_id}</b></div>
              <div><span style={{ color: t.ink2 }}>เริ่ม: </span><b>{selected.start_date}</b></div>
              <div><span style={{ color: t.ink2 }}>งวดทั้งหมด: </span><b>{selected.total_installments}</b></div>
              <div><span style={{ color: t.ink2 }}>ยอด/งวด: </span><b>{Number(selected.amount_per_installment).toLocaleString()}</b></div>
              <div><span style={{ color: t.ink2 }}>สถานะ: </span><b>{STATUS_LABEL_TH[selected.status]}</b></div>
            </div>
          </Card>
          <Card t={t} style={{ padding: 0, overflow: "hidden" }}>
            {history.length === 0 ? (
              <div style={{ padding: 40, textAlign: "center", color: t.ink3, fontSize: 13.5 }}>ยังไม่มีประวัติการจ่ายของสัญญานี้</div>
            ) : (
              <table style={{ width: "100%", borderCollapse: "collapse", fontSize: 13.5 }}>
                <thead><tr style={{ background: t.surfaceAlt }}>
                  {["งวดที่", "ประเภท", "จำนวนเงิน", "วันที่จ่าย"].map((h, i) => (
                    <th key={i} style={{ textAlign: i === 2 ? "right" : "left", padding: "9px 14px", color: t.ink2, fontWeight: 500, fontSize: 11.5 }}>{h}</th>
                  ))}
                </tr></thead>
                <tbody>
                  {history.map((h) => (
                    <tr key={h.payment_id} style={{ borderTop: `1px solid ${t.border}` }}>
                      <td style={{ padding: "9px 14px", fontFamily: "'IBM Plex Mono', monospace" }}>{h.installment_number}</td>
                      <td style={{ padding: "9px 14px" }}>{h.payment_type || "—"}</td>
                      <td style={{ padding: "9px 14px", textAlign: "right", fontFamily: "'IBM Plex Mono', monospace" }}>{Number(h.amount).toLocaleString()}</td>
                      <td style={{ padding: "9px 14px", fontFamily: "'IBM Plex Mono', monospace" }}>{h.payment_date}</td>
                    </tr>
                  ))}
                </tbody>
              </table>
            )}
          </Card>
        </>
      )}
    </div>
  );
}

/* ============================================================================
 * Admin — อนุมัติบัญชีใหม่ + จัดการสิทธิ์ผู้ใช้ (เห็นหน้านี้เฉพาะแอดมินเท่านั้น)
 * ==========================================================================*/
function AdminPage({ t, token }) {
  const [users, setUsers] = useState([]);
  const [branches, setBranches] = useState([]);
  const [userBranches, setUserBranches] = useState([]);
  const [loading, setLoading] = useState(true);
  const [err, setErr] = useState("");
  const [busyId, setBusyId] = useState(null);

  async function load() {
    setLoading(true); setErr("");
    try {
      const [u, b, ub] = await Promise.all([
        supabaseRest(`users?select=*&order=created_at.desc`, { token }),
        supabaseRest(`branches?select=*`, { token }),
        supabaseRest(`user_branches?select=*`, { token }),
      ]);
      setUsers(u); setBranches(b); setUserBranches(ub);
    } catch (e) { setErr(e.message); }
    finally { setLoading(false); }
  }
  useEffect(() => { if (token) load(); }, [token]);

  async function toggleActive(u) {
    setBusyId(u.user_id); setErr("");
    try {
      await supabaseRest(`users?user_id=eq.${u.user_id}`, { method: "PATCH", token, body: { is_active: !u.is_active } });
      await load();
    } catch (e) { setErr(e.message); }
    finally { setBusyId(null); }
  }
  async function toggleAdmin(u) {
    setBusyId(u.user_id); setErr("");
    try {
      await supabaseRest(`users?user_id=eq.${u.user_id}`, { method: "PATCH", token, body: { is_admin: !u.is_admin } });
      await load();
    } catch (e) { setErr(e.message); }
    finally { setBusyId(null); }
  }
  async function assignBranch(u, branchId) {
    if (!branchId) return;
    setBusyId(u.user_id); setErr("");
    try {
      await supabaseRest(`user_branches`, { method: "POST", token, body: { user_id: u.user_id, branch_id: branchId } });
      await load();
    } catch (e) { setErr(e.message); }
    finally { setBusyId(null); }
  }

  const pending = users.filter((u) => !u.is_active);
  const activeUsers = users.filter((u) => u.is_active);
  const branchesOf = (userId) => userBranches.filter((ub) => ub.user_id === userId).map((ub) => ub.branch_id);

  const rowBtn = { background: "transparent", border: `1px solid ${t.border}`, color: t.ink, borderRadius: 7, padding: "5px 10px", fontSize: 12, cursor: "pointer", fontFamily: "inherit" };

  return (
    <div>
      <PageHeader t={t} title="Admin" sub="อนุมัติบัญชีใหม่ และจัดการสิทธิ์ผู้ใช้ทั้งหมด" />
      <ErrBox t={t} msg={err} />
      {loading ? <Loading t={t} /> : (
        <>
          {pending.length > 0 && (
            <Card t={t} style={{ marginBottom: 16, borderColor: t.warn }}>
              <div style={{ fontWeight: 600, fontSize: 14.5, marginBottom: 12, color: t.warn, display: "flex", alignItems: "center", gap: 7 }}>
                <AlertTriangle size={15} /> รออนุมัติ ({pending.length})
              </div>
              <div style={{ display: "flex", flexDirection: "column", gap: 8 }}>
                {pending.map((u) => (
                  <div key={u.user_id} style={{ display: "flex", alignItems: "center", gap: 10, padding: "8px 10px", background: t.warnSoft, borderRadius: 8, flexWrap: "wrap" }}>
                    <span style={{ fontWeight: 600 }}>{u.username}</span>
                    <span style={{ fontSize: 11.5, color: t.ink3 }}>สมัครเมื่อ {new Date(u.created_at).toLocaleDateString("th-TH")}</span>
                    <button onClick={() => toggleActive(u)} disabled={busyId === u.user_id} style={{ ...rowBtn, marginLeft: "auto", background: t.ok, color: "#fff", border: "none", fontWeight: 600 }}>
                      {busyId === u.user_id ? "..." : "อนุมัติ"}
                    </button>
                  </div>
                ))}
              </div>
            </Card>
          )}
          <Card t={t} style={{ padding: 0, overflow: "hidden" }}>
            <div style={{ padding: "14px 18px", borderBottom: `1px solid ${t.border}`, fontWeight: 600, fontSize: 14.5 }}>ผู้ใช้ทั้งหมด ({activeUsers.length} คนใช้งานอยู่)</div>
            <table style={{ width: "100%", borderCollapse: "collapse", fontSize: 13.5 }}>
              <thead><tr style={{ background: t.surfaceAlt }}>
                {["รหัสผู้ใช้", "สาขาที่เข้าถึงได้", "แอดมิน", "สถานะ", ""].map((h, i) => (
                  <th key={i} style={{ textAlign: "left", padding: "9px 14px", color: t.ink2, fontWeight: 500, fontSize: 11.5 }}>{h}</th>
                ))}
              </tr></thead>
              <tbody>
                {users.map((u) => (
                  <tr key={u.user_id} style={{ borderTop: `1px solid ${t.border}` }}>
                    <td style={{ padding: "9px 14px", fontWeight: 600 }}>{u.username}</td>
                    <td style={{ padding: "9px 14px" }}>
                      <div style={{ display: "flex", gap: 6, alignItems: "center", flexWrap: "wrap" }}>
                        {branchesOf(u.user_id).map((bid) => (
                          <span key={bid} style={{ background: t.accentSoft, color: t.accent, borderRadius: 99, padding: "2px 8px", fontSize: 11 }}>{bid}</span>
                        ))}
                        <select defaultValue="" onChange={(e) => { assignBranch(u, e.target.value); e.target.value = ""; }} style={{ fontSize: 11, border: `1px solid ${t.border}`, borderRadius: 6, background: t.surface, color: t.ink2, padding: "2px 4px", fontFamily: "inherit" }}>
                          <option value="">+ เพิ่มสาขา</option>
                          {branches.filter((b) => !branchesOf(u.user_id).includes(b.branch_id)).map((b) => (
                            <option key={b.branch_id} value={b.branch_id}>{b.branch_name}</option>
                          ))}
                        </select>
                      </div>
                    </td>
                    <td style={{ padding: "9px 14px" }}>
                      <button onClick={() => toggleAdmin(u)} disabled={busyId === u.user_id} style={{ ...rowBtn, color: u.is_admin ? t.accent : t.ink3, borderColor: u.is_admin ? t.accent : t.border }}>{u.is_admin ? "แอดมิน" : "พนักงาน"}</button>
                    </td>
                    <td style={{ padding: "9px 14px" }}>
                      <span style={{ background: t[(u.is_active ? "ok" : "warn") + "Soft"], color: t[u.is_active ? "ok" : "warn"], borderRadius: 99, padding: "3px 10px", fontSize: 11.5, fontWeight: 600 }}>{u.is_active ? "ใช้งานอยู่" : "รออนุมัติ"}</span>
                    </td>
                    <td style={{ padding: "9px 14px" }}>
                      <button onClick={() => toggleActive(u)} disabled={busyId === u.user_id} style={rowBtn}>{u.is_active ? "ปิดสิทธิ์" : "เปิดสิทธิ์"}</button>
                    </td>
                  </tr>
                ))}
              </tbody>
            </table>
          </Card>
        </>
      )}
    </div>
  );
}

function LoginScreen({ t, mode, setMode, onAuthed }) {
  const [isSignup, setIsSignup] = useState(false);
  const [username, setUsername] = useState("");
  const [email, setEmail] = useState("");
  const [password, setPassword] = useState("");
  const [showPassword, setShowPassword] = useState(false);
  const [showForgot, setShowForgot] = useState(false);
  const [forgotSent, setForgotSent] = useState(false);
  const [busy, setBusy] = useState(false);
  const [err, setErr] = useState("");
  const [signupDone, setSignupDone] = useState(false);

  async function submit(e) {
    e.preventDefault();
    setErr(""); setBusy(true);
    try {
      if (isSignup) {
        await supabaseAuth("signup", { email, password, data: { username: username.trim() } });
        setSignupDone(true);
      } else {
        // ผู้ใช้กรอกแค่ "รหัสผู้ใช้" — ต้องแปลงเป็นอีเมลจริงที่ผูกไว้ตอนสมัครก่อน แล้วค่อยล็อกอิน
        // ด้วยอีเมลนั้น (Supabase Auth รู้จักแต่อีเมล ไม่รู้จักรหัสผู้ใช้โดยตรง)
        const resolvedEmail = await resolveEmailForUsername(username);
        const data = await supabaseAuth("token?grant_type=password", { email: resolvedEmail, password });
        onAuthed(data);
      }
    } catch (e2) {
      setErr(e2.message);
    } finally {
      setBusy(false);
    }
  }

  async function submitForgot(e) {
    e.preventDefault();
    setErr(""); setBusy(true);
    try {
      const resolvedEmail = await resolveEmailForUsername(username);
      await supabaseAuth("recover", { email: resolvedEmail });
      setForgotSent(true);
    } catch (e2) {
      setErr(e2.message);
    } finally {
      setBusy(false);
    }
  }

  const input = {
    width: "100%", padding: "10px 12px", borderRadius: 8, border: `1px solid ${t.border}`,
    background: t.surface, color: t.ink, fontSize: 14, fontFamily: "inherit", outline: "none", boxSizing: "border-box",
  };

  return (
    <div style={{ minHeight: "100vh", background: t.bg, color: t.ink, fontFamily: "'IBM Plex Sans Thai', sans-serif", display: "flex", alignItems: "center", justifyContent: "center", padding: 20 }}>
      <style>{FONT_IMPORT}</style>
      <button onClick={() => setMode(mode === "dark" ? "light" : "dark")} style={{ position: "absolute", top: 20, right: 20, width: 34, height: 34, borderRadius: 8, border: `1px solid ${t.border}`, background: t.surface, display: "flex", alignItems: "center", justifyContent: "center", cursor: "pointer", color: t.ink }}>
        {mode === "dark" ? <Sun size={16} /> : <Moon size={16} />}
      </button>
      <div style={{ width: "100%", maxWidth: 360 }}>
        <div style={{ display: "flex", alignItems: "center", gap: 10, marginBottom: 26, justifyContent: "center" }}>
          <div style={{ width: 34, height: 34, borderRadius: 9, background: t.accent, display: "flex", alignItems: "center", justifyContent: "center" }}>
            <Wallet size={17} color={t.accentInk} />
          </div>
          <div style={{ fontWeight: 700, fontSize: 16 }}>ระบบตรวจสอบค่างวด</div>
        </div>

        <div style={{ background: t.surface, border: `1px solid ${t.border}`, borderRadius: 14, padding: 22, boxShadow: t.shadow }}>
          {signupDone ? (
            <div style={{ textAlign: "center", padding: "10px 0" }}>
              <div style={{ fontWeight: 600, marginBottom: 8 }}>สมัครสำเร็จ</div>
              <div style={{ fontSize: 13, color: t.ink2, lineHeight: 1.6 }}>
                บัญชีของคุณรอแอดมินอนุมัติสิทธิ์ก่อนถึงจะใช้งานได้ — ถ้าระบบเปิดใช้การยืนยันอีเมลไว้ ให้ตรวจอีเมลที่กรอกไปเพื่อกดยืนยันก่อนด้วย
              </div>
              <button onClick={() => { setIsSignup(false); setSignupDone(false); }} style={{ marginTop: 16, background: t.accent, color: t.accentInk, border: "none", borderRadius: 8, padding: "9px 18px", fontSize: 13.5, fontWeight: 600, cursor: "pointer", fontFamily: "inherit" }}>
                ไปหน้าล็อกอิน
              </button>
            </div>
          ) : (
            <form onSubmit={submit}>
              <div style={{ fontWeight: 600, fontSize: 15, marginBottom: 16 }}>{isSignup ? "สมัครใช้งาน" : "เข้าสู่ระบบ"}</div>
              <div style={{ marginBottom: 12 }}>
                <label style={{ fontSize: 12, color: t.ink2, marginBottom: 5, display: "block", fontWeight: 500 }}>รหัสผู้ใช้</label>
                <input style={input} type="text" required value={username} onChange={(e) => setUsername(e.target.value)} placeholder="เช่น pim01 (ตัวอักษรอังกฤษ/ตัวเลข)" autoCapitalize="off" />
              </div>
              {isSignup && (
                <div style={{ marginBottom: 12 }}>
                  <label style={{ fontSize: 12, color: t.ink2, marginBottom: 5, display: "block", fontWeight: 500 }}>อีเมล</label>
                  <input style={input} type="email" required value={email} onChange={(e) => setEmail(e.target.value)} placeholder="you@example.com" />
                </div>
              )}
              <div style={{ marginBottom: 8 }}>
                <label style={{ fontSize: 12, color: t.ink2, marginBottom: 5, display: "block", fontWeight: 500 }}>รหัสผ่าน</label>
                <div style={{ position: "relative" }}>
                  <input style={{ ...input, paddingRight: 40 }} type={showPassword ? "text" : "password"} required minLength={6} value={password} onChange={(e) => setPassword(e.target.value)} placeholder="อย่างน้อย 6 ตัวอักษร" />
                  <button type="button" onClick={() => setShowPassword((s) => !s)} aria-label={showPassword ? "ซ่อนรหัสผ่าน" : "แสดงรหัสผ่าน"} style={{ position: "absolute", right: 4, top: 4, width: 30, height: 30, background: "none", border: "none", cursor: "pointer", color: t.ink3, display: "flex", alignItems: "center", justifyContent: "center" }}>
                    {showPassword ? <EyeOff size={16} /> : <Eye size={16} />}
                  </button>
                </div>
              </div>
              {!isSignup && (
                <button type="button" onClick={() => { setShowForgot((s) => !s); setForgotSent(false); setErr(""); }} style={{ background: "none", border: "none", color: t.ink3, fontSize: 12, cursor: "pointer", fontFamily: "inherit", padding: 0, marginBottom: 8 }}>
                  ลืมรหัสผ่าน?
                </button>
              )}
              {showForgot && !isSignup && (
                forgotSent ? (
                  <div style={{ background: t.okSoft, color: t.ok, borderRadius: 8, padding: "10px 12px", fontSize: 12, lineHeight: 1.6, marginBottom: 12 }}>
                    ส่งลิงก์รีเซ็ตรหัสผ่านไปที่อีเมลที่ผูกไว้กับรหัสผู้ใช้นี้แล้ว กรุณาตรวจสอบกล่องจดหมาย (รวมถึงถังสแปม)
                  </div>
                ) : (
                  <div style={{ background: t.surfaceAlt, borderRadius: 8, padding: "10px 12px", marginBottom: 12 }}>
                    <div style={{ fontSize: 12, color: t.ink2, marginBottom: 8, lineHeight: 1.5 }}>
                      กรอกรหัสผู้ใช้ในช่องด้านบนให้เรียบร้อย แล้วกดปุ่มนี้เพื่อส่งลิงก์รีเซ็ตรหัสผ่านไปที่อีเมลที่ผูกไว้
                    </div>
                    <button type="button" onClick={submitForgot} disabled={busy || !username.trim()} style={{ background: t.accent, color: t.accentInk, border: "none", borderRadius: 8, padding: "8px 14px", fontSize: 12.5, fontWeight: 600, cursor: busy ? "default" : "pointer", fontFamily: "inherit", opacity: busy || !username.trim() ? 0.6 : 1 }}>
                      ส่งลิงก์รีเซ็ตรหัสผ่าน
                    </button>
                  </div>
                )
              )}
              {err && <div style={{ color: t.bad, fontSize: 12.5, marginTop: 8 }}>{err}</div>}
              <button type="submit" disabled={busy} style={{ width: "100%", marginTop: 16, background: t.accent, color: t.accentInk, border: "none", borderRadius: 8, padding: "10px 18px", fontSize: 13.5, fontWeight: 600, cursor: busy ? "default" : "pointer", fontFamily: "inherit", display: "flex", alignItems: "center", justifyContent: "center", gap: 8, opacity: busy ? 0.7 : 1 }}>
                {busy && <Loader2 size={14} className="spin" />}
                {isSignup ? "สมัครใช้งาน" : "เข้าสู่ระบบ"}
              </button>
              <button type="button" onClick={() => { setIsSignup((s) => !s); setErr(""); }} style={{ width: "100%", marginTop: 10, background: "none", border: "none", color: t.accent, fontSize: 12.5, cursor: "pointer", fontFamily: "inherit" }}>
                {isSignup ? "มีบัญชีอยู่แล้ว? เข้าสู่ระบบ" : "ยังไม่มีบัญชี? สมัครใช้งาน"}
              </button>
            </form>
          )}
        </div>
      </div>
      <style>{`.spin{animation:spin 1s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}`}</style>
    </div>
  );
}

function CheckPage() {
  const [mode, setMode] = useState("dark");
  const t = THEME[mode];
  const [active, setActive] = useState("check");

  // ---------- auth state ----------
  const [session, setSession] = useState(null); // {access_token, user}
  const [profile, setProfile] = useState(null); // แถวจากตาราง users ของคนที่ login อยู่
  const [profileLoading, setProfileLoading] = useState(false);

  const loadProfile = useCallback(async (token, userId) => {
    setProfileLoading(true);
    try {
      const rows = await supabaseRest(`users?user_id=eq.${userId}&select=*`, { token });
      setProfile(rows[0] || null);
    } catch {
      setProfile(null);
    } finally {
      setProfileLoading(false);
    }
  }, []);

  function handleAuthed(data) {
    setSession(data);
    loadProfile(data.access_token, data.user.id);
  }
  function handleLogout() {
    setSession(null);
    setProfile(null);
  }

  const LOCAL_KEY = "checkpage_rows_v1";
  const [rows, setRows] = useState(() => {
    // เก็บรายการที่ตรวจไว้ในเครื่อง (localStorage) ให้ยังอยู่ต่อแม้รีเฟรชหน้า/ปิดแท็บ จนกว่าจะ
    // กด "ล้างรายการทั้งหมด" เอง — ใช้ localStorage ได้ปกติเพราะไฟล์นี้เป็นเว็บเพจจริงที่โฮสต์เอง
    // (ไม่ใช่อาร์ติแฟกต์ในแชทที่ห้ามใช้ browser storage)
    try {
      const saved = localStorage.getItem(LOCAL_KEY);
      return saved ? JSON.parse(saved) : [];
    } catch { return []; }
  });
  const [form, setForm] = useState({ code: "", period: "", amount: "", fee: "", cum: "", slip: "" });
  const [showExtra, setShowExtra] = useState(false);
  const [search, setSearch] = useState("");
  const [branch, setBranch] = useState("สุราษฎร์ธานี");
  const [checkDate, setCheckDate] = useState(() => new Date().toISOString().slice(0, 10));
  const nextId = useRef(rows.reduce((m, r) => Math.max(m, r.id || 0), 0) + 1);
  const periodRef = useRef(null);
  const amountRef = useRef(null);

  useEffect(() => {
    try { localStorage.setItem(LOCAL_KEY, JSON.stringify(rows)); } catch {}
  }, [rows]);

  const computed = useComputedRows(rows, session?.access_token, BRANCH_ID_MAP[branch], checkDate);
  const filtered = computed.filter((r) => {
    if (!search.trim()) return true;
    const q = search.trim().toLowerCase();
    return r.code.toLowerCase().includes(q) || r.period.toLowerCase().includes(q);
  });

  function addRow(e) {
    e?.preventDefault();
    if (!form.code.trim()) return;
    setRows((prev) => [...prev, { id: nextId.current++, ...form }]);
    setForm({ code: "", period: "", amount: "", fee: "", cum: "", slip: "" });
    document.getElementById("code-input")?.focus();
  }
  function removeRow(id) { setRows((prev) => prev.filter((r) => r.id !== id)); }
  function clearAll() {
    setRows([]);
    try { localStorage.removeItem(LOCAL_KEY); } catch {}
  }
  function handlePasteCode(e) {
    const text = e.clipboardData.getData("text");
    const lines = text.split(/\r?\n/).map((l) => l.trim()).filter(Boolean);
    if (lines.length >= 3) {
      e.preventDefault();
      setForm((f) => ({ ...f, code: lines[0], period: lines[1], amount: lines[2] }));
      setTimeout(() => amountRef.current?.focus(), 0);
    }
  }

  const input = {
    width: "100%", padding: "9px 11px", borderRadius: 8, border: `1px solid ${t.border}`,
    background: t.surface, color: t.ink, fontSize: 14, fontFamily: "'IBM Plex Mono', monospace",
    outline: "none", boxSizing: "border-box",
  };
  const label = { fontSize: 12, color: t.ink2, marginBottom: 5, display: "block", fontWeight: 500 };

  // ---------- ด่านตรวจสิทธิ์ก่อนเข้าเนื้อหาจริง ----------
  if (!session) {
    return <LoginScreen t={t} mode={mode} setMode={setMode} onAuthed={handleAuthed} />;
  }
  if (profileLoading || profile === null) {
    return (
      <div style={{ minHeight: "100vh", background: t.bg, color: t.ink2, fontFamily: "'IBM Plex Sans Thai', sans-serif", display: "flex", alignItems: "center", justifyContent: "center", gap: 8, fontSize: 13.5 }}>
        <style>{FONT_IMPORT}</style>
        <Loader2 size={16} className="spin" /> กำลังโหลดโปรไฟล์...
        <style>{`.spin{animation:spin 1s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}`}</style>
      </div>
    );
  }
  if (!profile.is_active) {
    return (
      <div style={{ minHeight: "100vh", background: t.bg, color: t.ink, fontFamily: "'IBM Plex Sans Thai', sans-serif", display: "flex", alignItems: "center", justifyContent: "center", padding: 20 }}>
        <style>{FONT_IMPORT}</style>
        <div style={{ textAlign: "center", maxWidth: 340 }}>
          <div style={{ width: 44, height: 44, borderRadius: 99, background: t.warnSoft, color: t.warn, display: "flex", alignItems: "center", justifyContent: "center", margin: "0 auto 14px" }}>
            <ShieldCheck size={20} />
          </div>
          <div style={{ fontWeight: 600, fontSize: 15, marginBottom: 6 }}>บัญชีรออนุมัติ</div>
          <div style={{ fontSize: 13, color: t.ink2, lineHeight: 1.6, marginBottom: 18 }}>
            เข้าสู่ระบบสำเร็จแล้ว แต่บัญชี <b>{profile.username}</b> ยังรอแอดมินเปิดสิทธิ์ใช้งาน — ติดต่อแอดมินของสาขาเพื่อขอเปิดสิทธิ์
          </div>
          <button onClick={handleLogout} style={{ background: "transparent", border: `1px solid ${t.border}`, color: t.ink, borderRadius: 8, padding: "9px 18px", fontSize: 13, cursor: "pointer", fontFamily: "inherit" }}>
            ออกจากระบบ
          </button>
        </div>
      </div>
    );
  }

  return (
    <div style={{ display: "flex", minHeight: "100vh", background: t.bg, color: t.ink, fontFamily: "'IBM Plex Sans Thai', sans-serif" }}>
      <style>{FONT_IMPORT}</style>

      <aside style={{ width: 220, background: t.sidebar, padding: "20px 14px", display: "flex", flexDirection: "column", flexShrink: 0 }}>
        <div style={{ display: "flex", alignItems: "center", gap: 9, padding: "0 8px", marginBottom: 28 }}>
          <div style={{ width: 30, height: 30, borderRadius: 8, background: t.accent, display: "flex", alignItems: "center", justifyContent: "center" }}>
            <Wallet size={15} color={mode === "dark" ? t.accentInk : "#fff"} />
          </div>
          <div>
            <div style={{ color: "#fff", fontWeight: 700, fontSize: 13.5, lineHeight: 1.2 }}>ตรวจค่างวด</div>
            <div style={{ color: t.sidebarInkMute, fontSize: 10.5 }}>สุราษฎร์ธานี</div>
          </div>
        </div>

        <nav style={{ display: "flex", flexDirection: "column", gap: 3 }}>
          {NAV.filter((n) => !n.adminOnly || profile.is_admin).map((n) => {
            const isActive = active === n.key;
            return (
              <button
                key={n.key}
                onClick={() => setActive(n.key)}
                style={{
                  display: "flex", alignItems: "center", gap: 10, padding: "9px 10px", borderRadius: 9,
                  background: isActive ? t.accent : "transparent", color: isActive ? t.accentInk : t.sidebarInk,
                  border: "none", cursor: "pointer", fontSize: 13, fontFamily: "inherit", fontWeight: isActive ? 600 : 400,
                  textAlign: "left", transition: "background .15s",
                }}
              >
                <n.icon size={15} />
                {n.label}
              </button>
            );
          })}
        </nav>

        <div style={{ marginTop: "auto", paddingTop: 16, borderTop: `1px solid ${t.border}`, display: "flex", alignItems: "center", gap: 9 }}>
          <div style={{ width: 28, height: 28, borderRadius: 99, background: t.infoSoft, color: t.info, display: "flex", alignItems: "center", justifyContent: "center", fontSize: 11, fontWeight: 700, flexShrink: 0 }}>
            {(profile.nickname || profile.username || "?")[0].toUpperCase()}
          </div>
          <div style={{ minWidth: 0, flex: 1 }}>
            <div style={{ color: "#fff", fontSize: 12, fontWeight: 600, overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap" }}>{profile.nickname || profile.username}</div>
            <div style={{ color: t.sidebarInkMute, fontSize: 10.5 }}>{profile.is_admin ? "Admin" : "พนักงาน"}</div>
          </div>
          <button onClick={handleLogout} aria-label="ออกจากระบบ" title="ออกจากระบบ" style={{ background: "none", border: "none", color: t.sidebarInkMute, cursor: "pointer", padding: 4, flexShrink: 0 }}>
            <LogOut size={14} />
          </button>
        </div>
      </aside>

      <main style={{ flex: 1, padding: "22px 28px 60px", minWidth: 0 }}>
        <div style={{ display: "flex", alignItems: "center", gap: 14, marginBottom: 22 }}>
          <div style={{ position: "relative", flex: 1, maxWidth: 360 }}>
            <Search size={14} style={{ position: "absolute", left: 12, top: 11, color: t.ink3 }} />
            <input placeholder="ค้นหารหัสลูกค้า, งวด..." style={{ ...input, padding: "9px 12px 9px 34px", fontFamily: "inherit" }} />
          </div>
          <div style={{ marginLeft: "auto", display: "flex", alignItems: "center", gap: 10 }}>
            <div style={{ position: "relative" }}>
              <select value={branch} onChange={(e) => setBranch(e.target.value)} style={{ appearance: "none", padding: "8px 30px 8px 12px", borderRadius: 8, border: `1px solid ${t.border}`, background: t.surface, color: t.ink, fontSize: 13, fontFamily: "inherit", cursor: "pointer" }}>
                <option>สุราษฎร์ธานี</option><option>สมุย</option><option>หลังสวน</option>
              </select>
              <ChevronDown size={14} style={{ position: "absolute", right: 10, top: 10, color: t.ink2, pointerEvents: "none" }} />
            </div>
            <button style={{ width: 34, height: 34, borderRadius: 8, border: `1px solid ${t.border}`, background: t.surface, display: "flex", alignItems: "center", justifyContent: "center", cursor: "pointer", color: t.ink, position: "relative" }}>
              <Bell size={15} />
              <span style={{ position: "absolute", top: 6, right: 7, width: 6, height: 6, borderRadius: 99, background: t.bad }} />
            </button>
            <button onClick={() => setMode(mode === "dark" ? "light" : "dark")} aria-label="สลับโหมด" style={{ width: 34, height: 34, borderRadius: 8, border: `1px solid ${t.border}`, background: t.surface, display: "flex", alignItems: "center", justifyContent: "center", cursor: "pointer", color: t.ink }}>
              {mode === "dark" ? <Sun size={16} /> : <Moon size={16} />}
            </button>
          </div>
        </div>

        {active === "check" && (
        <>
        <h1 style={{ fontSize: 21, fontWeight: 700, margin: "0 0 3px", letterSpacing: -0.3 }}>ตรวจสอบการรับชำระเงิน</h1>
        <div style={{ fontSize: 12.5, color: t.ink2, marginBottom: 20, display: "flex", alignItems: "center", gap: 6 }}>
          <span style={{ position: "relative", width: 7, height: 7, borderRadius: 99, background: t.ok, display: "inline-block" }}>
            <span style={{ position: "absolute", inset: 0, borderRadius: 99, background: t.ok, opacity: 0.5, animation: "pulse 2s infinite" }} />
          </span>
          เชื่อมต่อฐานข้อมูลแล้ว · วันที่ {new Date().toLocaleDateString("th-TH", { day: "numeric", month: "long", year: "numeric" })}
        </div>

        <form onSubmit={addRow} style={{ background: t.surface, border: `1px solid ${t.border}`, borderRadius: 14, padding: 18, marginBottom: 20, boxShadow: t.shadow }}>
          <div style={{ display: "flex", alignItems: "center", gap: 8, marginBottom: 14 }}>
            <Plus size={16} color={t.accent} />
            <span style={{ fontWeight: 600, fontSize: 14.5 }}>เพิ่มรายการรับชำระเงิน</span>
            <span style={{ marginLeft: "auto", fontSize: 11.5, color: t.ink3 }}>วาง 3 บรรทัด (รหัส/งวด/ยอด) ลงช่องรหัส ระบบกระจายให้เอง</span>
          </div>
          <div style={{ marginBottom: 12, maxWidth: 200 }}>
            <label style={label}>วันที่ทำรายการ</label>
            <input type="date" style={input} value={checkDate} onChange={(e) => setCheckDate(e.target.value)} />
          </div>
          <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr 1fr", gap: 12 }}>
            <div>
              <label style={label}>รหัสลูกค้า</label>
              <input id="code-input" style={input} placeholder="เช่น 9" value={form.code} onPaste={handlePasteCode}
                onChange={(e) => setForm((f) => ({ ...f, code: e.target.value }))}
                onKeyDown={(e) => e.key === "Enter" && periodRef.current?.focus()} />
            </div>
            <div>
              <label style={label}>งวดที่</label>
              <input ref={periodRef} style={input} placeholder="เช่น 1 หรือ 2(บางส่วน)" value={form.period}
                onChange={(e) => setForm((f) => ({ ...f, period: e.target.value }))}
                onKeyDown={(e) => e.key === "Enter" && amountRef.current?.focus()} />
            </div>
            <div>
              <label style={label}>จำนวนเงิน</label>
              <input ref={amountRef} style={input} placeholder="฿ 0" value={form.amount}
                onChange={(e) => setForm((f) => ({ ...f, amount: e.target.value }))}
                onKeyDown={(e) => e.key === "Enter" && addRow(e)} />
            </div>
          </div>
          <button type="button" onClick={() => setShowExtra((s) => !s)} style={{ background: "none", border: "none", color: t.accent, fontSize: 12.5, padding: "10px 0 0", cursor: "pointer", fontFamily: "inherit" }}>
            {showExtra ? "− ซ่อนข้อมูลเพิ่มเติม" : "+ ข้อมูลเพิ่มเติม (ค่าธรรมเนียม / สะสม / ยอดตามสลิป)"}
          </button>
          {showExtra && (
            <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr 1fr", gap: 12, marginTop: 10 }}>
              <div><label style={label}>ค่าธรรมเนียม</label><input style={input} placeholder="เว้นว่างได้" value={form.fee} onChange={(e) => setForm((f) => ({ ...f, fee: e.target.value }))} /></div>
              <div><label style={label}>สะสม (เดี่ยว)</label><input style={input} placeholder="เว้นว่างได้" value={form.cum} onChange={(e) => setForm((f) => ({ ...f, cum: e.target.value }))} /></div>
              <div><label style={label}>ยอดตามสลิป</label><input style={input} placeholder="เว้นว่างได้" value={form.slip} onChange={(e) => setForm((f) => ({ ...f, slip: e.target.value }))} /></div>
            </div>
          )}
          <div style={{ display: "flex", gap: 10, marginTop: 16 }}>
            <button type="submit" style={{ background: t.accent, color: t.accentInk, border: "none", borderRadius: 8, padding: "10px 18px", fontSize: 13.5, fontWeight: 600, cursor: "pointer", fontFamily: "inherit", display: "flex", alignItems: "center", gap: 6 }}>
              <Plus size={15} /> เพิ่มรายการ
            </button>
            <button type="button" onClick={clearAll} style={{ background: "transparent", color: t.bad, border: `1px solid ${t.border}`, borderRadius: 8, padding: "10px 16px", fontSize: 13.5, cursor: "pointer", fontFamily: "inherit", display: "flex", alignItems: "center", gap: 6 }}>
              <Trash2 size={14} /> ล้างรายการทั้งหมด
            </button>
          </div>
        </form>

        <div style={{ background: t.surface, border: `1px solid ${t.border}`, borderRadius: 14, overflow: "hidden", boxShadow: t.shadow }}>
          <div style={{ padding: "14px 18px", borderBottom: `1px solid ${t.border}`, display: "flex", alignItems: "center", gap: 12 }}>
            <span style={{ fontWeight: 600, fontSize: 14.5 }}>รายการวันนี้</span>
            <span style={{ color: t.ink3, fontSize: 12.5, fontFamily: "'IBM Plex Mono', monospace" }}>{computed.length} แถว</span>
            <div style={{ marginLeft: "auto", position: "relative", width: 200 }}>
              <Search size={13} style={{ position: "absolute", left: 10, top: 10, color: t.ink3 }} />
              <input placeholder="กรองในตาราง..." value={search} onChange={(e) => setSearch(e.target.value)} style={{ ...input, padding: "7px 10px 7px 30px", fontSize: 12.5, fontFamily: "inherit" }} />
            </div>
          </div>
          {filtered.length === 0 ? (
            <div style={{ padding: 40, textAlign: "center", color: t.ink3, fontSize: 13.5 }}>ยังไม่มีรายการ — เพิ่มรายการรับชำระเงินด้านบนเพื่อเริ่มตรวจสอบ</div>
          ) : (
            <table style={{ width: "100%", borderCollapse: "collapse", fontSize: 13.5 }}>
              <thead>
                <tr style={{ background: t.surfaceAlt }}>
                  {["#", "รหัสลูกค้า", "งวดที่", "จำนวนเงิน", "ผลการตรวจสอบ", ""].map((h, i) => (
                    <th key={i} style={{ textAlign: i === 3 ? "right" : "left", padding: "9px 14px", color: t.ink2, fontWeight: 500, fontSize: 11.5 }}>{h}</th>
                  ))}
                </tr>
              </thead>
              <tbody>
                {filtered.map((r, idx) => (
                  <tr key={r.id} style={{ borderTop: `1px solid ${t.border}`, background: r.result.tone === "bad" ? t.badSoft : "transparent" }}>
                    <td style={{ padding: "10px 14px", color: t.ink3, fontFamily: "'IBM Plex Mono', monospace", fontSize: 12.5 }}>{idx + 1}</td>
                    <td style={{ padding: "10px 14px", fontFamily: "'IBM Plex Mono', monospace" }}>{r.code}</td>
                    <td style={{ padding: "10px 14px", fontFamily: "'IBM Plex Mono', monospace" }}>{r.period}</td>
                    <td style={{ padding: "10px 14px", textAlign: "right", fontFamily: "'IBM Plex Mono', monospace" }}>{r.amount ? Number(r.amount).toLocaleString() : "—"}</td>
                    <td style={{ padding: "10px 14px" }}>
                      {r.result.status ? (
                        <div>
                          <span style={{ display: "inline-flex", alignItems: "center", gap: 6, background: t[r.result.tone + "Soft"], color: t[r.result.tone], border: `1px solid ${t[r.result.tone]}33`, borderRadius: 99, padding: "3px 10px", fontSize: 12, fontWeight: 600 }}>
                            <span style={{ fontSize: 8 }}>{TONE_DOT[r.result.tone]}</span>{r.result.status}
                          </span>
                          {r.result.note && <div style={{ fontSize: 11.5, color: t.ink3, marginTop: 4 }}>{r.result.note}</div>}
                        </div>
                      ) : (<span style={{ color: t.ink3 }}>—</span>)}
                    </td>
                    <td style={{ padding: "10px 14px", textAlign: "right" }}>
                      <button onClick={() => removeRow(r.id)} aria-label="ลบแถว" style={{ background: "none", border: "none", color: t.ink3, cursor: "pointer", padding: 4 }}><X size={14} /></button>
                    </td>
                  </tr>
                ))}
              </tbody>
            </table>
          )}
        </div>

        <div style={{ marginTop: 18, fontSize: 11.5, color: t.ink3 }}>เชื่อมต่อฐานข้อมูลจริงแล้ว — ยังไม่มีปุ่มบันทึกถาวร (ตรวจสอบสถานะได้แต่ยังไม่เขียนข้อมูลใหม่ลง Supabase) จะเพิ่มในขั้นถัดไป</div>
        </>
        )}

        {active === "dashboard" && <DashboardPage t={t} token={session.access_token} branchId={BRANCH_ID_MAP[branch]} />}
        {active === "wr" && <WRPage t={t} token={session.access_token} branchId={BRANCH_ID_MAP[branch]} />}
        {active === "archive" && <ArchivePage t={t} token={session.access_token} branchId={BRANCH_ID_MAP[branch]} />}
        {active === "fix" && <FixPage t={t} token={session.access_token} branchId={BRANCH_ID_MAP[branch]} />}
        {active === "admin" && (
          profile.is_admin
            ? <AdminPage t={t} token={session.access_token} />
            : <div style={{ color: t.ink3, fontSize: 13.5 }}>หน้านี้สำหรับแอดมินเท่านั้น</div>
        )}
      </main>

      <style>{`
        @keyframes pulse { 0%,100%{transform:scale(1);opacity:.5} 50%{transform:scale(2.2);opacity:0} }
        select:focus, input:focus { border-color: ${t.accent} !important; box-shadow: 0 0 0 3px ${t.accentSoft}; }
      `}</style>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<CheckPage />);
</script>
<script>
  const source = document.getElementById('app-source').textContent;
  const output = Babel.transform(source, {
    presets: [["react", { runtime: "classic" }]],
  }).code;
  (0, eval)(output);
</script>
</body>
